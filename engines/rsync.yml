# The rsync engine: how bytes move from an rsync upstream to an S3 bucket (R2), for every
# mirror that includes this file flattened beside the toolbox. A run is a list diff, never
# a local tree: list upstream, diff it against the state file the last run left in the
# bucket, fetch the delta in batches of BATCH_GB, upload, checkpoint the state once per
# batch, delete what left upstream, and reconcile the bucket against the state when the
# toolbox's due says one is due (RECONCILE and RECONCILE_HOURS are its vars). The mirror
# orders these verbs in its pipeline and holds its identity in root vars.
#
# Read from the mirror: SOURCE, BUCKET, HOST (required); and, each with an inline default,
# CEILING_GB (0: no ceiling), BATCH_GB (4), MAX_BATCHES (4), LIST_FLOOR (0: no
# truncated-listing guard), RETRY_BASE (15 s), TL and TL_KEY (a signed TeX Live subtree
# and the fingerprint that signs it; empty: no signature checks), FILTER (rsync filter
# arguments for the listing; empty: the whole tree), OWN (bucket-root keys the mirror owns
# and reconcile never deletes, space separated; empty: none), INDEX (the directory-page
# key suffix; set, index draws a page for every directory), PAGE_FOOT (the HTML every page
# closes on, %s the directory's encoded path; empty: none), CANARY (a file whose bytes the
# zone's HTML rewriters would alter; set, smoke reads it through the domain as a Perl
# client), FRESH_KEY and FRESH_HOURS (a file in which upstream records its own clock, and
# the age past which smoke fails the run; empty: no freshness check).
#
# Every object's Content-Type is decided here, by label, never guessed by the AWS CLI:
# the CLI keeps the first half of Python's guess, which serves foo.diff.gz as a diff, and
# its guesses move with the image.
#
# Hooks: prepare, verify, index, smoke, smoke-mirror and report-engine are the verbs a
# mirror may replace, by listing each under excludes: on this include and defining its
# own. prepare and verify do nothing until TL_KEY is set, index until INDEX is set;
# smoke-mirror does nothing here. pipeline and plan-pipeline are the vocabulary in order;
# a mirror that needs another order excludes and redefines them.
#
# Rules this file keeps, as the toolbox does: no vars: default for anything a mirror
# owns, because a value here shadows the mirror's root value, and every tunable is an
# inline {{.X | default N}}, because a mirror's root value in turn shadows a KEY=value
# given on the command line inside the image (task sync -- MAX_BATCHES=8 reaches these
# verbs only while no vars: block names MAX_BATCHES). A var of another name that reads
# the tunable still sees the command line, so each default is spelled once, below. The
# rest of the vars derive from the mirror's or are the engine's own helpers.
version: '3'

vars:
  # The engine names its image. The IMAGE on the toolbox include, for example the -dev
  # image of a lib example, must win. So this value is a default: a literal value here
  # beats the include.
  IMAGE: '{{.IMAGE | default "ghcr.io/katoptra/toolbox:rsync-v2"}}'
  S3: s3://{{.BUCKET}}
  URL: https://{{.HOST}}
  STATE: .state/applied.txt.xz                  # the listing of what the bucket holds; never in upstream
  INDEXED: .state/indexed.txt.xz                # the state as the directory pages last showed it
  BATCHES_MAX: '{{.MAX_BATCHES | default 4}}'   # batches per run; the rest chain the next run
  RETRY_S: '{{.RETRY_BASE | default 15}}'       # seconds; a retry sleeps RETRY_S * 2^i plus jitter
  FRESH_H: '{{.FRESH_HOURS | default 24}}'      # hours; GNU's and CTAN's monitors call a mirror old past 28
  # A compressed file's type, then the name endings that select it, ftp.gnu.org's types.
  # The ending wins over the rest of the name: foo.diff.gz is gzip, and a browser handed
  # text/x-diff draws the compressed bytes as text. label applies it to every upload.
  # Case matters: .Z is compress.
  COMPRESSED: |-
    application/x-gzip .gz .tgz .taz .tz .svgz
    application/x-bzip2 .bz2 .tbz2 .tbz
    application/x-xz .xz .txz
    application/x-compress .Z
    application/zstd .zst .tzst
    application/x-lzip .lz
    application/x-lzma .lzma
  # Upstream's clock in a timestamp file, as Unix time or as "YYYY-MM-DD HH:MM" for date -d:
  # gnu's mirror-updated-timestamp.txt and Savannah's 00_TIME.txt open on Unix time, and
  # CTAN's timestamp carries 2026-10-08-05-02 after a comment and the master's name.
  STAMP: |-
    awk '!/^#/ { for (i = 1; i <= NF; i++) {
      if ($i ~ /^[0-9]+$/ && length($i) >= 9) { print $i; exit }
      if ($i ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) {
        split($i, d, "-"); print d[1] "-" d[2] "-" d[3] " " d[4] ":" d[5]; exit } } }'
  RSYNC: rsync --timeout=300 --contimeout=60 --no-h
  CURL: curl -fsS --connect-timeout 15 --max-time 60 --retry 6 --retry-connrefused --retry-max-time 600
  AWS_FLAGS: --no-progress --cli-connect-timeout 60 --cli-read-timeout 300
  # The keyring is read as a plain file from the same mirror as the signature, so the pinned
  # fingerprint is the only real check; GOODSIG too, because gpgv reports an expired or
  # revoked key as VALIDSIG with exit 0. An awk program over gpgv's --status-fd 1 lines,
  # given the fingerprint as k where it is used, so a call var TL_KEY reaches it.
  GPGCHECK: '/^\[GNUPG:\] GOODSIG /{g=1} /^\[GNUPG:\] VALIDSIG / && $NF == k {v=1} END{exit !(g&&v)}'
  # An object's size from the headers of a one-byte ranged read, which costs no bandwidth on
  # a 6.87 GB file and answers where a HEAD does not: Cloudflare streams text/html and sends
  # it no content-length. content-range carries the total, an empty object answers 416, and
  # over file:// (the offline check) there is neither, only the length itself.
  SIZE: |-
    awk 'tolower($1) == "content-range:" { split($3, a, "/"); r = a[2] }
      tolower($1) == "content-length:" { c = $2 }
      $2 == "416" { z = 1 }
      END { sub(/\r/, "", r); sub(/\r/, "", c); print (r != "" ? r : (z ? 0 : c)) }'
  # Percent-encoding for awk: enc(s) keeps the unreserved set and "/" and encodes the rest
  # (upstream paths carry spaces and ( ) [ ] { } & # > ~ $). Spliced into ENCODE, and into a
  # mirror's page renderer.
  URLENC: |-
    BEGIN { for (i = 0; i < 256; i++) ord[sprintf("%c", i)] = i }
    function enc(s,  out, j, c) { out = ""; for (j = 1; j <= length(s); j++) { c = substr(s, j, 1)
        out = out ((c ~ /[A-Za-z0-9\/._~-]/) ? c : sprintf("%%%02X", ord[c])) } return out }
  # Path to URL path. Reads paths, prints path TAB encoded.
  ENCODE: >-
    awk '{{.URLENC}} { print $0 "\t" enc($0) }'
  # Every directory above the paths given (stdin, or a path-first TSV file), each once, as
  # "a/b/" with the root as an empty line, so that directory INDEX is the page's key.
  ANCESTORS: |-
    awk -F'\t' '!("" in s) { s[""] = 1; print "" }
      { n = split($1, c, "/"); d = ""; for (i = 1; i < n; i++) { d = d c[i] "/"; if (!(d in s)) { s[d] = 1; print d } } }'

tasks:
  pipeline:
    desc: clock -> due -> list -> state -> rebuild? -> diff -> split -> prepare -> batches -> delete -> reconcile? -> index -> smoke -> report -> ping
    cmds:
      - {task: clock}
      - {task: due}
      - {task: list}
      - {task: state}
      - {task: rebuild}
      - {task: diff}
      - {task: split}
      - {task: prepare}
      - {task: batches}
      - {task: delete}
      - {task: reconcile}
      - {task: index}
      - {task: smoke}
      - {task: report}
      - {task: ping}

  plan-pipeline:
    desc: 'The read-only half: clock -> list -> state -> diff -> split'
    cmds:
      - {task: clock}
      - {task: list}
      - {task: state}
      - {task: diff}
      - {task: split}

  # ---- the listing and the state ----
  list:
    desc: List upstream, narrowed by FILTER when set, and normalise it to RUN/upstream.txt as "path TAB size TAB mtime", byte-sorted
    set: [pipefail]
    cmds:
      # publish.txt and labeled.txt are appended across batches within a run, and the rest
      # are written only by the verb that needs them; a reused workspace must start each run
      # with them gone, or smoke and the report count old lines.
      - rm -f {{.RUN}}/publish.txt {{.RUN}}/labeled.txt {{.RUN}}/orphans.txt {{.RUN}}/unlanded.txt {{.RUN}}/fresh.txt
      - mkdir -p {{.RUN}} {{.STAGING}}
      # -L lists every symlink as its file. One whose target is gone upstream is reported
      # and skipped, and rsync exits 23 with the rest of the listing intact; retry passes
      # that. A listing cut short is caught by LIST_FLOOR, not by the exit code.
      - task: retry
        vars: {CMD: '{{.RSYNC}}{{if .FILTER}} {{.FILTER}}{{end}} -rL --list-only {{.SOURCE}} > {{.RUN}}/listing.txt'}
      - {task: normalise}

  normalise:
    desc: RUN/listing.txt (rsync --list-only) to RUN/upstream.txt; every regular file, as "path TAB size TAB mtime", byte-sorted
    set: [pipefail]
    cmds:
      # The size column may carry commas (rsync 3.x) or be blank for a zero-byte file
      # (openrsync), so it is found from the fixed-width date, not by field. Every regular
      # file upstream lists is kept: tlnet stores each container under a revision-stamped
      # name with a symlink at the stable name beside it, -L resolves both, and the mirror
      # serves both, as every other mirror of such a tree does.
      - >-
        awk '
          /^-/ && match($0, / [0-9][0-9][0-9][0-9]\/[0-9][0-9]\/[0-9][0-9] [0-9][0-9]:[0-9][0-9]:[0-9][0-9] /) {
            path = substr($0, RSTART + RLENGTH); mtime = substr($0, RSTART + 1, RLENGTH - 2)
            size = substr($0, 11, RSTART - 11); gsub(/[ ,]/, "", size)
            print path "\t" size + 0 "\t" mtime }' {{.RUN}}/listing.txt \
        | LC_ALL=C sort > {{.RUN}}/upstream.txt
      # A truncated listing must never become a deletion list. LIST_FLOOR is a line count
      # the listing never legitimately falls to, about half its usual size; unset, no guard.
      - '{{if .LIST_FLOOR}}test "$(wc -l < {{.RUN}}/upstream.txt)" -gt {{.LIST_FLOOR}}{{else}}echo "no LIST_FLOOR: a truncated listing is not caught here"{{end}}'

  state:
    desc: Fetch the state file to RUN/applied.txt; a missing one is rebuilt from a bucket listing (an empty bucket gives an empty state, and the first run fills it)
    cmds:
      - mkdir -p {{.RUN}}
      # The bucket is the mirror and the state is a cache of it: a missing one costs one
      # listing, never an upload.
      - {task: pull, vars: {KEY: '{{.STATE}}', OUT: '{{.RUN}}/applied.txt', MISSING: 'echo "no state at {{.STATE}}: rebuilding it from the bucket" >&2; touch {{.RUN}}/rebuild-now'}}

  pull:
    desc: An xz-compressed KEY from the bucket, decompressed to OUT; MISSING runs when the bucket has no such key
    internal: true
    requires: {vars: [KEY, OUT, MISSING]}
    cmds:
      # aws s3 ls exits 1 when nothing matches and 0 when the key exists; any other code is
      # a real error and must not be mistaken for a missing key.
      - |
        rc=0; aws s3 ls {{.S3}}/{{.KEY}} > /dev/null || rc=$?
        case $rc in
          0) aws s3 cp {{.AWS_FLAGS}} {{.S3}}/{{.KEY}} {{.OUT}}.xz && xz -dc {{.OUT}}.xz > {{.OUT}} ;;
          1) {{.MISSING}} ;;
          *) exit $rc ;;
        esac

  push:
    desc: FILE, xz-compressed, to the bucket's KEY as one PutObject; the old object or the new one is in the bucket, never half
    internal: true
    requires: {vars: [FILE, KEY]}
    cmds:
      - xz -T0 -c {{.FILE}} > {{.FILE}}.xz
      - aws s3 cp {{.AWS_FLAGS}} {{.FILE}}.xz {{.S3}}/{{.KEY}}

  rebuild:
    desc: List the bucket and make the state exactly what is there (a lost state file, or a reconcile)
    status: ['test ! -f {{.RUN}}/rebuild-now']
    set: [pipefail]
    cmds:
      # aws s3 ls: "date time size key"; the key may hold spaces. R2 does not list in byte
      # order (install-tl after install-tl.zip.sha512.asc), so sort before join and comm.
      # Exit 1 is "nothing listed", which an empty bucket is; pipefail must not fail on it.
      - >-
        { aws s3 ls --recursive {{.S3}}/ || test $? -eq 1; }
        | awk '{ if (match($0, /^[^ ]+ +[^ ]+ +[0-9]+ /)) print substr($0, RLENGTH + 1) "\t" $3 }'
        | LC_ALL=C sort > {{.RUN}}/bucket.txt
      # A key is applied when the bucket has it at upstream's size; its mtime is upstream's.
      - >-
        LC_ALL=C join -t "$(printf '\t')" -o 1.1,1.2,1.3,2.2 {{.RUN}}/upstream.txt {{.RUN}}/bucket.txt
        | awk -F'\t' -v OFS='\t' '$2 == $4 { print $1, $2, $3 }' > {{.RUN}}/applied.new
      - {task: push, vars: {FILE: '{{.RUN}}/applied.new', KEY: '{{.STATE}}'}}
      - mv {{.RUN}}/applied.new {{.RUN}}/applied.txt
      - rm -f {{.RUN}}/rebuild-now

  diff:
    desc: RUN/changed.txt (lines upstream has and the state lacks, plus the file each changed signed sha512 names), deleted.txt (paths the state has and upstream lacks), paths.txt
    cmds:
      - LC_ALL=C comm -13 {{.RUN}}/applied.txt {{.RUN}}/upstream.txt > {{.RUN}}/changed.txt
      # Upstream can write a signed sha512 again while the file it names stands still: TeX
      # Live's nightly build checksums and signs its prebuilt installer every night. The
      # named file joins the delta, so verify checks it against the new sha512 in staging.
      # The pattern is verify's.
      - >-
        awk -F'\t' -v TL="{{.TL}}" 'NR == FNR { if ($1 ~ "^" TL "/(tlpkg/texlive\\.tlpdb|[^/]+)\\.sha512$") want[substr($1, 1, length($1) - 7)]; next }
        $1 in want' {{.RUN}}/changed.txt {{.RUN}}/upstream.txt | LC_ALL=C sort -u -o {{.RUN}}/changed.txt - {{.RUN}}/changed.txt
      - cut -f1 {{.RUN}}/upstream.txt > {{.RUN}}/paths.txt
      - cut -f1 {{.RUN}}/applied.txt | LC_ALL=C comm -23 - {{.RUN}}/paths.txt > {{.RUN}}/deleted.txt

  split:
    desc: Refuse a tree over CEILING_GB (when set) or a file the disk cannot hold; split changed.txt into RUN/batch-NNNN.txt
    cmds:
      # CEILING_GB unset or 0 is no ceiling; the size is printed either way.
      - >-
        {{if .CEILING_GB}}awk -F'\t' -v gb={{.CEILING_GB}} '{ s += $2 }
          END { printf "upstream: %d objects, %.2f GB, ceiling %d GB\n", NR, s / 1e9, gb; exit (s > gb * 1e9) }' \
        {{.RUN}}/upstream.txt{{else}}awk -F'\t' '{ s += $2 } END { printf "upstream: %d objects, %.2f GB, no ceiling\n", NR, s / 1e9 }' {{.RUN}}/upstream.txt{{end}}
      - mkdir -p {{.STAGING}} && find {{.STAGING}} -mindepth 1 -delete
      - df -Pk {{.STAGING}}
      # The largest single file must fit with 1 GiB to spare for RUN's text and the OS.
      - >-
        awk -F'\t' -v kb="$(df -Pk {{.STAGING}} | awk 'NR == 2 { print $4 }')" \
          '$2 / 1024 > kb - 1048576 { print "no room for " $1 " (" $2 " bytes)"; bad = 1 } END { exit bad }' \
        {{.RUN}}/changed.txt
      - rm -f {{.RUN}}/batch-*.txt
      # Cumulative size from the listing; nothing is touched to split. A file over the cap is
      # a batch by itself and leaves the running batch alone. The decision batch goes last.
      # It holds TL's tlpkg/ (the tlpdb) and the files at the bucket root, the FRESH_KEY
      # file among them. So nothing that a client reads to decide what to fetch can name a
      # key that has not landed.
      # A path that extends the previous one (x, x.sha512, x.sha512.asc) never starts a new batch, and diff puts x in the delta whenever x.sha512 is, so verify always finds the file its signature names.
      # ponytail: BATCH_GB is spliced bare because it lands inside $(( )), where a quoted
      # operand is a syntax error. What keeps it safe is the workflow refusing a vars input
      # that is not a plain value. Ceiling: another caller handing untrusted text to
      # `task sync --`. Upgrade path: assert it is numeric here, and regenerate render.txt
      # in lib, ctan and tlnet, which all record this line.
      - >-
        awk -F'\t' -v OFS='\t' -v CAP=$(({{.BATCH_GB | default 4}} * 1000000000)) -v DIR={{.RUN}} -v TL="{{.TL}}" '
          index($1, TL "/tlpkg/") == 1 || $1 !~ /\// { dec[++nd] = $0; next }
          $2 > CAP { f = name(++n); print > f; close(f); next }
          { if (sz + $2 > CAP && index($1, prev) != 1) flush(); buf[++nb] = $0; sz += $2; prev = $1 }
          END { flush(); if (nd) { f = name(++n); for (i = 1; i <= nd; i++) print dec[i] > f; close(f) }
                printf "%d lines in %d batches\n", NR, n }
          function name(i) { return sprintf("%s/batch-%04d.txt", DIR, i) }
          function flush(  i, f) { if (!nb) return; f = name(++n)
            for (i = 1; i <= nb; i++) print buf[i] > f; close(f); nb = sz = 0; split("", buf) }' \
        {{.RUN}}/changed.txt

  # ---- the batches ----
  prepare:
    desc: With TL_KEY set and the delta touching TL, fetch its control files into RUN/tl and check the signed sha512 against the pinned key; the no-op hook otherwise
    status:
      - 'test -z "{{.TL_KEY}}" || test "$(grep -c "^{{.TL}}/" {{.RUN}}/changed.txt 2>/dev/null)" = 0'
    set: [pipefail]
    cmds:
      - mkdir -p {{.RUN}}/tl
      - printf '%s\n' tlpkg/texlive.tlpdb.xz tlpkg/texlive.tlpdb.sha512 tlpkg/texlive.tlpdb.sha512.asc tlpkg/gpg/pubring.gpg > {{.RUN}}/tl/files.txt
      - task: retry
        vars: {CMD: '{{.RSYNC}} -Lt --files-from={{.RUN}}/tl/files.txt {{.SOURCE}}{{.TL}}/ {{.RUN}}/tl/'}
      - xz -dkf {{.RUN}}/tl/tlpkg/texlive.tlpdb.xz
      - >-
        cd {{.RUN}}/tl/tlpkg && shasum -a 512 -c texlive.tlpdb.sha512 &&
        gpgv --status-fd 1 --keyring gpg/pubring.gpg texlive.tlpdb.sha512.asc texlive.tlpdb.sha512 | awk -v k={{.TL_KEY}} '{{.GPGCHECK}}'

  batches:
    desc: Work the first MAX_BATCHES of RUN/batch-NNNN.txt in name order; each commits before the next starts
    vars:
      BATCHES:
        sh: ls {{.RUN}}/batch-*.txt 2>/dev/null | head -n {{.BATCHES_MAX}}
    cmds:
      - for: {var: BATCHES, split: "\n", as: B}
        task: batch
        vars: {B: '{{.B}}'}
      # Batches past MAX_BATCHES wait for the next run; the chain file asks the workflow to
      # queue it now rather than at the next hour, which is how an empty bucket fills.
      - test "$(ls {{.RUN}}/batch-*.txt 2>/dev/null | wc -l)" -le {{.BATCHES_MAX}} || touch {{.RUN}}/chain

  batch:
    internal: true
    requires: {vars: [B]}
    status: ['test -z "{{.B}}"']   # an empty delta loops once with an empty item
    cmds:
      - {task: fetch, vars: {B: '{{.B}}'}}
      - {task: verify, vars: {B: '{{.B}}'}}
      - {task: publish, vars: {B: '{{.B}}'}}
      - {task: checkpoint, vars: {B: '{{.B}}'}}

  fetch:
    internal: true
    requires: {vars: [B]}
    preconditions:
      - sh: test "$(df -Pk {{.STAGING}} | awk 'NR == 2 { print $4 }')" -gt "$(awk -F'\t' '{ s += $2 } END { print int(s / 1024) + 1048576 }' {{.B}})"
        msg: "not enough free disk for {{.B}}"
    cmds:
      - find {{.STAGING}} -mindepth 1 -delete
      - cut -f1 {{.B}} > {{.RUN}}/files.txt
      # --files-from implies --relative (parents are created) and not -r; -L turns every
      # symlink into its file. A path that vanished since the listing is skipped: it never
      # lands in staging, so merge (the batch joined against what staging holds) drops it
      # from the state rather than recording it; any object it once had in the bucket
      # waits for the next reconcile to clean up. No --partial: staging is emptied every
      # batch, so there is nothing to resume, and a partial file must never reach the bucket.
      - task: retry
        vars: {CMD: '{{.RSYNC}} -Lt --files-from={{.RUN}}/files.txt --ignore-missing-args {{.SOURCE}} {{.STAGING}}/'}

  verify:
    requires: {vars: [B]}   # public, so a mirror can run it by hand against a canned batch
    status: ['test -z "{{.TL_KEY}}"']   # the no-op hook until a mirror pins a key
    # Each command works from STAGING by its own cd, not dir:, which a path-based include
    # resolves against the include's directory and no call var can move.
    cmds:
      # Every signed sha512 in this batch (root installers and updaters, the tlpdb) checks
      # against the keyring already pinned by prepare. The while loop's status is the pipeline's.
      - >-
        cd {{.STAGING}} && cut -f1 {{.B}} | grep -E '^{{.TL}}/(tlpkg/texlive\.tlpdb|[^/]+)\.sha512$' | while IFS= read -r f; do
        (cd "$(dirname "$f")" && f=$(basename "$f") && shasum -a 512 -c "$f" &&
        gpgv --status-fd 1 --keyring {{.RUN}}/tl/tlpkg/gpg/pubring.gpg "$f.asc" "$f" | awk -v k={{.TL_KEY}} '{{.GPGCHECK}}')
        || exit 1; done
      # Every TL container in this batch must match the checksum the verified tlpdb gives
      # it, under both the names upstream carries: the stable one the tlpdb names and the
      # revision-stamped one it describes, the same bytes and so the same checksum. The END
      # clause is the belt: a container the tlpdb says nothing about cannot pass. Written to
      # a file rather than piped, so awk's status is its own; verify runs without pipefail
      # because the grep above legitimately matches nothing.
      # A batch that carries no container skips all of it. RUN/tl belongs to prepare, whose
      # status gate is the delta touching TL at all, so an hour that changes nothing there
      # never makes the directory and the redirect below would have nowhere to write. want is
      # empty in that case anyway, leaving the belt nothing to refuse. Whenever the guard does
      # pass, the batch holds a TL path, so prepare ran and RUN/tl is there. The sums are
      # checked inside the same command that writes them, so no batch is ever checked against
      # the sums left by the batch before it -- fetch empties staging between the two.
      - >-
        cd {{.STAGING}} && { test "$(grep -c '^{{.TL}}/archive/' {{.B}})" = 0 || {
        awk -F'\t' -v TL="{{.TL}}" 'NR == FNR { if (index($1, TL "/archive/") == 1) want[$1] = 1; next }
          /^name /{split($0, a, " "); n = a[2]} /^revision /{split($0, a, " "); r = a[2]}
          /^containerchecksum /{split($0, a, " "); emit(a[2], n)}
          /^doccontainerchecksum /{split($0, a, " "); emit(a[2], n ".doc")}
          /^srccontainerchecksum /{split($0, a, " "); emit(a[2], n ".source")}
          function emit(sum, base,   p, q) { p = TL "/archive/" base ".tar.xz"; q = TL "/archive/" base ".r" r ".tar.xz"
            if (p in want) { print sum "  " p; delete want[p] }
            if (q in want) { print sum "  " q; delete want[q] } }
          END { for (p in want) { print "no checksum in the tlpdb for " p > "/dev/stderr"; bad = 1 } exit bad }' \
        {{.B}} {{.RUN}}/tl/tlpkg/texlive.tlpdb > {{.RUN}}/tl/sums.txt &&
        shasum -a 512 -c --quiet {{.RUN}}/tl/sums.txt; }; }
      # The decision batch. The tlpdb it carries must be the one verified at the start of
      # the run, the .xz tlmgr downloads must decompress to it byte for byte, and every
      # container it names must be in the bucket after this run: the state, plus this
      # batch, minus this run's deletions.
      - >-
        cd {{.STAGING}} && { test ! -f {{.TL}}/tlpkg/texlive.tlpdb || {
        cmp {{.TL}}/tlpkg/texlive.tlpdb {{.RUN}}/tl/tlpkg/texlive.tlpdb &&
        xz -dc {{.TL}}/tlpkg/texlive.tlpdb.xz | cmp - {{.TL}}/tlpkg/texlive.tlpdb &&
        { cut -f1 {{.RUN}}/applied.txt; cut -f1 {{.B}}; } | LC_ALL=C sort -u
        | LC_ALL=C comm -23 - {{.RUN}}/deleted.txt > {{.RUN}}/tl/after.txt &&
        awk -v TL="{{.TL}}" '/^name /{n=$2}
          /^containerchecksum /{print TL "/archive/" n ".tar.xz"}
          /^doccontainerchecksum /{print TL "/archive/" n ".doc.tar.xz"}
          /^srccontainerchecksum /{print TL "/archive/" n ".source.tar.xz"}' {{.TL}}/tlpkg/texlive.tlpdb \
        | LC_ALL=C sort | LC_ALL=C comm -23 - {{.RUN}}/tl/after.txt > {{.RUN}}/tl/missing.txt &&
        test ! -s {{.RUN}}/tl/missing.txt; }; }

  publish:
    internal: true
    requires: {vars: [B]}
    set: [pipefail]   # tee must never mask a failed upload
    cmds:
      - {task: label}
      - cat {{.RUN}}/labels.txt >> {{.RUN}}/labeled.txt
      # The CLI takes one --content-type a call and guesses from the name without one, so
      # each type's files go up from a tree of their own, RUN/up/N/, and come back for
      # merge. cp --recursive never lists the destination. It sends each file as one
      # PutObject, or in parts above the threshold in the image's aws.config. Keys are the
      # paths under the tree, which are upstream's own.
      - {task: label-trees, vars: {TO: up}}
      - >-
        for d in {{.RUN}}/up/*/; do test -d "$d" || continue;
        aws s3 cp {{.AWS_FLAGS}} --recursive --content-type "$(cat "${d%/}.type")" "$d" {{.S3}}/ | tee -a {{.RUN}}/publish.txt; done
      - {task: label-trees, vars: {TO: staging}}
      # The FRESH_KEY file goes up alone, after all other files. It dates the tree, and
      # monitors such as mirmon read it.
      # ponytail: this command and label-trees splice FRESH_KEY bare into an awk string and
      # a Python string. Ceiling: a key with a quote, a backslash or a non-ASCII character
      # breaks them. Upgrade path: give it to awk with -v and to Python as an argument.
      # Then regenerate render.txt in lib and in each rsync mirror.
      - >-
        {{if .FRESH_KEY}}test ! -f {{.STAGING}}/{{shellQuote .FRESH_KEY}} ||
        aws s3 cp {{.AWS_FLAGS}} --content-type "$(awk -F'\t' '$1 == "{{.FRESH_KEY}}" { print $2 }' {{.RUN}}/labels.txt)"
        {{.STAGING}}/{{shellQuote .FRESH_KEY}} {{.S3}}/{{shellQuote .FRESH_KEY}} | tee -a {{.RUN}}/publish.txt{{end}}

  label:
    desc: RUN/labels.txt, "path TAB type" for every file under DIR (STAGING), byte-sorted; the type is decided from the name and the first KiB, never left to the CLI
    vars:
      DIR: '{{if .DIR}}{{.DIR}}{{else}}{{.STAGING}}{{end}}'
    cmds:
      # Rules, in order. A COMPRESSED ending names the type outright. An ending Python reads
      # as compressed that COMPRESSED lacks (.br) gets a signature's type or
      # application/octet-stream, never text: brotli has no signature to find. Otherwise the
      # image's mime.types names it, unless it is one a browser draws (text, XML, JSON,
      # JavaScript, PDF) and the bytes disagree: compressed, or carrying a NUL, or a PDF
      # without %PDF-. A name it cannot type is typed from the bytes: a known signature,
      # text/plain without a NUL, application/octet-stream with one. A stray control byte is
      # not a NUL: CTAN's old .sty files carry ^Z and stay text. "./" keeps guess_type from
      # reading a name with a colon as a URL scheme.
      - |
        python3 -I - {{shellQuote .DIR}} {{shellQuote .COMPRESSED}} > {{.RUN}}/labels.raw <<'PY'
        import mimetypes, os, sys

        root, table = sys.argv[1], sys.argv[2]
        endings = {s: f[0] for f in map(str.split, table.splitlines()) if f for s in f[1:]}
        signatures = ((b"\x1f\x8b", "application/x-gzip"), (b"BZh", "application/x-bzip2"),
                      (b"\xfd7zXZ\x00", "application/x-xz"), (b"\x1f\x9d", "application/x-compress"),
                      (b"\x28\xb5\x2f\xfd", "application/zstd"), (b"LZIP", "application/x-lzip"),
                      (b"PK\x03\x04", "application/zip"), (b"%PDF-", "application/pdf"))
        drawn = ("text/", "application/xml", "application/json", "application/javascript", "application/pdf")

        def from_bytes(head):
            for sig, t in signatures:
                if head.startswith(sig):
                    return t
            text = b"\0" not in head or head.startswith((b"\xfe\xff", b"\xff\xfe"))
            return "text/plain" if text else "application/octet-stream"

        def label(name, head):
            for ending, t in endings.items():
                if name.endswith(ending):
                    return t
            t, encoding = mimetypes.guess_type("./" + name)
            seen = from_bytes(head)
            if encoding:
                return "application/octet-stream" if seen == "text/plain" else seen
            if t is None:
                return seen
            if t.startswith(drawn) or t.endswith(("+xml", "+json")):
                agrees = b"%PDF-" in head if t == "application/pdf" else seen == "text/plain"
                return t if agrees else seen
            return t

        out = sys.stdout.buffer
        for d, _, files in os.walk(root):
            for f in files:
                p = os.path.join(d, f)
                with open(p, "rb") as h:
                    head = h.read(1024)
                out.write(os.fsencode(os.path.relpath(p, root)) + b"\t" + label(f, head).encode() + b"\n")
        PY
      - LC_ALL=C sort {{.RUN}}/labels.raw > {{.RUN}}/labels.txt && rm {{.RUN}}/labels.raw

  label-trees:
    desc: 'TO=up: rename every file of RUN/labels.txt but the FRESH_KEY file out of STAGING into RUN/up/N/, one tree per type, its type in RUN/up/N.type. TO=staging: rename them back'
    internal: true
    requires: {vars: [TO]}
    cmds:
      # Renames on one filesystem, so no byte is copied, and staging is whole again for
      # merge. A run that dies between the two leaves files under up/; the next run's fetch
      # starts staging from nothing and this starts up/ from nothing.
      # The FRESH_KEY file stays in staging, and publish sends it last. With no FRESH_KEY,
      # the empty name matches no file, so every file moves.
      - |
        python3 -I - {{.STAGING}} {{.RUN}}/up {{.RUN}}/labels.txt {{.TO}} <<'PY'
        import os, shutil, sys

        staging, up, labels, to = (os.fsencode(a) for a in sys.argv[1:5])

        def move(a, b):
            os.makedirs(os.path.dirname(b), exist_ok=True)
            os.rename(a, b)

        if to == b"up":
            shutil.rmtree(up, ignore_errors=True)
            trees = {}
            with open(labels, "rb") as f:
                for line in f:
                    path, t = line.rstrip(b"\n").split(b"\t")
                    if path != b"{{.FRESH_KEY}}":
                        n = trees.setdefault(t, str(len(trees) + 1).encode())
                        move(os.path.join(staging, path), os.path.join(up, n, path))
            for t, n in trees.items():
                with open(os.path.join(up, n + b".type"), "wb") as f:
                    f.write(t)
        else:
            for n in os.listdir(up) if os.path.isdir(up) else ():
                tree = os.path.join(up, n)
                for d, _, files in os.walk(tree) if os.path.isdir(tree) else ():
                    for f in files:
                        p = os.path.join(d, f)
                        move(p, os.path.join(staging, os.path.relpath(p, tree)))
            shutil.rmtree(up, ignore_errors=True)
        PY

  merge:
    desc: RUN/applied.new = the state minus B's paths, plus B's lines for the files that are in STAGING
    set: [pipefail]
    requires: {vars: [B]}
    cmds:
      # Only what landed enters the state: a path that vanished upstream between listing
      # and fetch is dropped, so the state never names a key the bucket lacks. Called with
      # deleted.txt (bare paths, empty staging) this is a pure drop. 0.1 s on 511k lines.
      - (cd {{.STAGING}} && find . -type f | sed 's|^\./||' | LC_ALL=C sort) > {{.RUN}}/landed.txt
      - >-
        awk -F'\t' 'NR == FNR { drop[$1] = 1; next } !($1 in drop)' {{.B}} {{.RUN}}/applied.txt
        | cat - <(LC_ALL=C join -t "$(printf '\t')" {{.RUN}}/landed.txt {{.B}}) | LC_ALL=C sort > {{.RUN}}/applied.new

  checkpoint:
    internal: true
    requires: {vars: [B]}
    set: [pipefail]
    cmds:
      - {task: merge, vars: {B: '{{.B}}'}}
      - {task: push, vars: {FILE: '{{.RUN}}/applied.new', KEY: '{{.STATE}}'}}
      - mv {{.RUN}}/applied.new {{.RUN}}/applied.txt
      - find {{.STAGING}} -mindepth 1 -delete

  # ---- deletions ----
  remove:
    internal: true
    requires: {vars: [K]}
    status: ['test ! -s {{.K}}']   # nothing to remove
    set: [pipefail]
    cmds:
      - rm -f {{.RUN}}/del-*; split -l 1000 -a 4 {{.K}} {{.RUN}}/del-
      # Quiet mode returns only errors, and the CLI exits 0 even then, so grep for them.
      - >-
        for f in {{.RUN}}/del-*; do
        awk 'BEGIN { printf "{\"Objects\":[" } { gsub(/\\/, "\\\\"); gsub(/"/, "\\\"")
             printf "%s{\"Key\":\"%s\"}", (NR > 1 ? "," : ""), $0 } END { print "],\"Quiet\":true}" }' "$f" \
        > "$f.json" && aws s3api delete-objects --bucket {{.BUCKET}} --delete "file://$f.json" | tee -a {{.RUN}}/publish.txt
        | { test "$(grep -c Errors)" = 0; }; done

  delete:
    desc: Remove the keys in D (RUN/deleted.txt unless given), 1,000 per DeleteObjects call and free, and drop them from the state
    vars:
      # reconcile passes its own orphan list, so the run's deleted.txt, which report counts,
      # is left as diff wrote it.
      D: '{{if .D}}{{.D}}{{else}}{{.RUN}}/deleted.txt{{end}}'
    # Nothing to delete, or a batch is still waiting for a later hour: the live tlpdb may
    # still name these containers, so they go only in the hour every batch has landed.
    status: ['test ! -s {{.D}} || test -f {{.RUN}}/chain']
    cmds:
      - {task: remove, vars: {K: '{{.D}}'}}
      - {task: checkpoint, vars: {B: '{{.D}}'}}

  reconcile:
    desc: When due left .run/reconcile, rebuild the state from a bucket listing, delete keys that neither upstream nor .state/ owns, and record the reconcile
    # Not while a batch waits for a later run: delete would hold the orphans back, so the run
    # stays due and the chained run that lands the last batch reconciles. A run that fails
    # before the last line records nothing either, so the next run is due too.
    status: ['test ! -f {{.RUN}}/reconcile || test -f {{.RUN}}/chain']
    cmds:
      - touch {{.RUN}}/rebuild-now
      - {task: rebuild}
      # A mirror's own keys are no orphans: the bucket-root keys in OWN, and, only when
      # INDEX is set, the directory pages an index hook draws under two keys. One key names
      # itself (the INDEX suffix); the other is a bare directory of the state,
      # indistinguishable from an upstream path, so the state's own directory set is the
      # list. A path that stops being a directory upstream leaves the set and is judged as
      # a file. Without INDEX both lists are empty: the suffix would otherwise degenerate to
      # "/" and spare every key that ends in one.
      - >-
        {{if .INDEX}}{{.ANCESTORS}} {{.RUN}}/applied.txt
        | awk '$0 != "" { print substr($0, 1, length($0) - 1) }' | LC_ALL=C sort > {{.RUN}}/index-keys.txt{{else}}: > {{.RUN}}/index-keys.txt{{end}}
      - >-
        cut -f1 {{.RUN}}/bucket.txt | grep -vE '^\.state/'{{if .OWN}} | grep -vxF -f <(printf '%s\n' {{.OWN}}){{end}}
        {{if .INDEX}}| awk -v i="/{{.INDEX}}" '{ s = "/" $0 } substr(s, length(s) - length(i) + 1) != i'{{end}}
        | LC_ALL=C comm -23 - {{.RUN}}/index-keys.txt
        | LC_ALL=C comm -23 - {{.RUN}}/paths.txt > {{.RUN}}/orphans.txt
      - {task: delete, vars: {D: '{{.RUN}}/orphans.txt'}}
      - {task: reconciled}

  # ---- after the bytes moved ----
  index:
    desc: 'Hook. With INDEX set: redraw the directory pages this run changed and publish them; INDEXED, the state the pages last showed, moves forward only after they landed. A mirror with a landing page of its own replaces it'
    status: ['test -z "{{.INDEX}}"']
    set: [pipefail]
    vars:
      SLASH: '{{.RUN}}/slash'
    cmds:
      # No INDEXED means no page has been drawn: every directory is drawn once (ctan's 27k take
      # about ten minutes), and the file exists from then on.
      - {task: pull, vars: {KEY: '{{.INDEXED}}', OUT: '{{.RUN}}/indexed.txt', MISSING: ': > {{.RUN}}/indexed.txt'}}
      - {task: pages}
      # Staging holds nothing but pages by now: checkpoint emptied it. They stay for smoke;
      # the next run's split clears them. Not appended to publish.txt: smoke sizes that
      # sample against upstream, which has no pages.
      - test ! -s {{.RUN}}/index-make.txt || aws s3 cp {{.AWS_FLAGS}} --recursive --content-type text/html {{.STAGING}}/ {{.S3}}/
      # One upload per depth, because no single tree holds both a/b and a/b/. A slashless key
      # carries no suffix to guess from, so the type is given: without it the CLI sends
      # binary/octet-stream and a browser downloads the page instead of drawing it.
      - >-
        for d in {{.SLASH}}/*/; do test -d "$d" || continue;
        aws s3 cp {{.AWS_FLAGS}} --recursive --content-type text/html "$d" {{.S3}}/; done
      - {task: remove, vars: {K: '{{.RUN}}/index-gone.txt'}}
      # The pages now show the state, and the bucket already holds it: checkpoint put it there
      # before this verb ran. One server-side copy moves INDEXED forward; no bytes leave the
      # runner. A run that dies before this line redraws the same pages next run.
      - aws s3 cp {{.AWS_FLAGS}} {{.S3}}/{{.STATE}} {{.S3}}/{{.INDEXED}}

  pages:
    desc: RUN/indexed.txt against RUN/applied.txt -> a page under both of its keys for every directory a changed line touches, RUN/index-gone.txt for the keys of directories that emptied
    set: [pipefail]
    vars:
      # Every page is written under two keys: <dir>/INDEX, which the zone's rewrite serves for a
      # directory URL, and <dir> without its trailing slash, which serves the same URL written
      # without one, where every other mirror answers 301. No filesystem holds both a/b and
      # a/b/, so the second copies stage one tree per directory depth and upload a tree at a
      # time. A task var, because a global cannot follow a RUN the caller passes.
      SLASH: '{{.RUN}}/slash'
    cmds:
      - mkdir -p {{.STAGING}} {{.SLASH}} && find {{.STAGING}} {{.SLASH}} -mindepth 1 -delete
      # A page changes when a file in its directory or a directory below it appears, changes
      # or goes, so every ancestor of every changed line is redrawn. ponytail: about five
      # pages per touched directory where one would often do; ceiling is Class A, a few
      # hundred a day against a million free. Upgrade: comm the directory sets of the two
      # files and redraw a parent only for a new or gone child.
      - >-
        LC_ALL=C comm -3 {{.RUN}}/indexed.txt {{.RUN}}/applied.txt | awk -F'\t' '{ print ($1 == "" ? $2 : $1) }'
        | {{.ANCESTORS}} | LC_ALL=C sort > {{.RUN}}/index-dirty.txt
      - '{{.ANCESTORS}} {{.RUN}}/applied.txt | LC_ALL=C sort > {{.RUN}}/index-dirs.txt'
      # A gone directory takes both of its keys with it. The root has no slashless key.
      - >-
        LC_ALL=C comm -23 {{.RUN}}/index-dirty.txt {{.RUN}}/index-dirs.txt
        | awk -v i="{{.INDEX}}" '{ print $0 i } $0 != "" { print substr($0, 1, length($0) - 1) }' > {{.RUN}}/index-gone.txt
      - LC_ALL=C comm -12 {{.RUN}}/index-dirty.txt {{.RUN}}/index-dirs.txt > {{.RUN}}/index-make.txt
      - test ! -s {{.RUN}}/index-make.txt || awk -v s="{{.STAGING}}/" '{ print s $0 }' {{.RUN}}/index-make.txt | tr '\n' '\0' | xargs -0 mkdir -p
      # SLASH/<depth>/ holds the slashless copies of the pages at that depth. Every file in
      # one tree has the same number of components, so no file is another's parent directory
      # and the tree can be uploaded whole. -r because the root is the one directory with no
      # slashless key: a run whose only dirty directory is the root -- root files alone, or
      # a deletion that leaves no dirty directory still standing -- gives this awk nothing to
      # print, and xargs without it runs mkdir once with no operands.
      - >-
        test ! -s {{.RUN}}/index-make.txt ||
        awk -v r="{{.SLASH}}/" '$0 != "" { n = split($0, c, "/"); d = ""
          for (i = 1; i < n - 1; i++) d = d c[i] "/"; print r (n - 1) "/" d }' {{.RUN}}/index-make.txt \
        | LC_ALL=C sort -u | tr '\n' '\0' | xargs -0r mkdir -p
      # Entries, "dir TAB d|f TAB name TAB size TAB mtime", from the state: what the bucket
      # holds, never upstream. Sorted, a directory's lines are contiguous with its
      # subdirectories first, so each page is written once and closed. Names are
      # percent-encoded in href and HTML-escaped in text. The page is built whole and written
      # under both of its keys, so the two are the same bytes; the base href is what lets one
      # document serve /dir/ and /dir alike, where a relative href would otherwise resolve
      # against the parent for the second. PAGE_FOOT closes every page, %s standing for the
      # directory's encoded path; empty, the page closes on its table.
      - >-
        test ! -s {{.RUN}}/index-make.txt ||
        awk -F'\t' -v OFS='\t' 'NR == FNR { want[$0] = 1; next }
          { n = split($1, c, "/"); d = ""
            for (i = 1; i < n; i++) { if ((d in want) && !((d c[i]) in seen)) { seen[d c[i]] = 1; print d, "d", c[i], "", "" }; d = d c[i] "/" }
            if (d in want) print d, "f", c[n], $2, $3 }' {{.RUN}}/index-make.txt {{.RUN}}/applied.txt \
        | LC_ALL=C sort | awk -F'\t' -v S="{{.STAGING}}/" -v R="{{.SLASH}}/" -v I="{{.INDEX}}" -v F={{shellQuote (.PAGE_FOOT | default "")}} '{{.URLENC}}
          function esc(s) { gsub(/&/, "\\&amp;", s); gsub(/</, "\\&lt;", s); gsub(/>/, "\\&gt;", s); gsub(/"/, "\\&quot;", s); return s }
          function open(d) { cur = d; live = 1
            p = "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Index of /" esc(d) "</title>\n"
            p = p "<base href=\"/" enc(d) "\">\n"
            p = p "<style>body{font-family:monospace;margin:2em}td,th{text-align:left;padding:0 1.5em 0 0}</style></head><body>\n"
            p = p "<h1>Index of /" esc(d) "</h1><table><tr><th>Name</th><th>Last modified</th><th>Size</th></tr>\n"
            if (d != "") p = p "<tr><td><a href=\"../\">../</a></td><td></td><td></td></tr>\n" }
          function shut(  f, b, k, e) { p = p "</table>" (F == "" ? "" : "<p>" sprintf(F, enc(cur)) "</p>") "</body></html>\n"
            f = S cur I; printf("%s", p) > f; close(f)
            if (cur != "") { b = substr(cur, 1, length(cur) - 1); k = split(b, e, "/")
              f = R k "/" b; printf("%s", p) > f; close(f) } }
          !live || $1 != cur { if (live) shut(); open($1) }
          $2 == "d" { p = p "<tr><td><a href=\"" enc($3) "/\">" esc($3) "/</a></td><td></td><td></td></tr>\n"; next }
          { p = p "<tr><td><a href=\"" enc($3) "\">" esc($3) "</a></td><td>" $5 "</td><td>" $4 "</td></tr>\n" }
          END { if (live) shut() }'

  smoke:
    desc: Read a key of every type this run published back through the domain, size against the listing and type against the label; with TL set the tlpdb sha512 against the verified copy; with INDEX set one redrawn page under both keys; with CANARY set the canary, as a Perl client, against the bucket's copy; no Content-Encoding on a .tar.gz; warn of paths that never land; fresh; then the mirror's own checks, smoke-mirror
    vars:
      # The sample below reads the FRESH_KEY file only once the state says that it landed.
      # It rides the decision batch, the last one, so a first fill capped at MAX_BATCHES has
      # not reached it and the bucket answers 404 to a key it has never held; the run it
      # lands in and every run after name it. Empty is the only falsy value, so the path is
      # both the flag and the key.
      TS:
        sh: |-
          {{if .FRESH_KEY}}awk -F'\t' -v k={{shellQuote .FRESH_KEY}} '$1 == k { print $1 }' {{.RUN}}/applied.txt 2>/dev/null || true{{end}}
    cmds:
      # The sample is the first key of every type label gave this run, read back by its
      # encoded URL and looked up by its raw path: its size against the listing, and over
      # http its Content-Type against the label, which is what finds the CLI, R2 or the zone
      # serving a type other than the one decided. The FRESH_KEY file joins for its size
      # alone. A sampled key is as likely as any other to carry a space.
      - >-
        { {{if .TS}}printf '%s\t\n' {{shellQuote .TS}};{{end}}
        awk -F'\t' '!seen[$2]++' {{.RUN}}/labeled.txt 2>/dev/null; }
        | while IFS="$(printf '\t')" read -r k t; do
        u=$(printf '%s\n' "$k" | {{.ENCODE}} | cut -f2);
        want=$(awk -F'\t' -v k="$k" '$1 == k { print $2 }' {{.RUN}}/upstream.txt);
        h=$({{.CURL}} -r 0-0 -D - -o /dev/null "{{.URL}}/$u");
        got=$(printf '%s\n' "$h" | {{.SIZE}});
        ct=$(printf '%s\n' "$h" | awk 'tolower($1) == "content-type:" { sub(/\r$/, ""); print $2 }');
        echo "$k: $got bytes (listing: $want), served as ${ct:-no type} (label: ${t:-none})"; test "$got" = "$want" || exit 1;
        case "{{.URL}}" in http*) test -z "$t" || test "$ct" = "$t" || exit 1 ;; esac; done
      # The tlpdb key rides the decision batch, the last one, so a run that stopped at
      # MAX_BATCHES has not published this hour's copy yet and has nothing to compare.
      - >-
        {{if .TL}}test ! -f {{.RUN}}/tl/tlpkg/texlive.tlpdb.sha512 ||
        test -f {{.RUN}}/chain ||
        {{.CURL}} {{.URL}}/{{.TL}}/tlpkg/texlive.tlpdb.sha512 | cmp - {{.RUN}}/tl/tlpkg/texlive.tlpdb.sha512{{else}}echo "no TL subtree: no tlpdb to read back"{{end}}
      # One page this run redrew, read back under both of its keys by key (no zone rule
      # needed) and sized against the copy still in staging, the same one-byte ranged read as
      # the sample. Both keys hold the same bytes, so one staged copy sizes both. The root has
      # no slashless key. ${d} in braces: the INDEX that follows it opens with a letter, and
      # $d{{.INDEX}} names a variable that does not exist; test -n makes that a stated
      # failure, not a size of "". The slashless key is read only over http: the offline
      # check serves the pages off a filesystem, which cannot hold both a/b and a/b/.
      - >-
        {{if .INDEX}}test ! -s {{.RUN}}/index-make.txt || { d=$(tail -1 {{.RUN}}/index-make.txt);
        want=$(wc -c < "{{.STAGING}}/${d}{{.INDEX}}" | tr -d ' '); test -n "$want";
        case "{{.URL}}" in http*) b=1 ;; *) b=0 ;; esac;
        printf '%s\n' "$d" | awk -v i="{{.INDEX}}" -v b="$b" '{ print $0 i } b == 1 && $0 != "" { print substr($0, 1, length($0) - 1) }'
        | {{.ENCODE}} | while IFS="$(printf '\t')" read -r k u; do
        got=$({{.CURL}} -r 0-0 -D - -o /dev/null "{{.URL}}/$u" | {{.SIZE}});
        echo "$k: $got bytes (page: $want)"; test "$got" = "$want" || exit 1; done; }{{else}}echo "no INDEX: no directory pages to read back"{{end}}
      # Cloudflare's HTML rewriters sit between R2 and the client, so what finds them is the
      # object compared with what the domain serves. A size check is not enough: Automatic
      # HTTPS Rewrites can lengthen a link by a byte while the parser it runs in collapses a
      # newline inside the same tag, leaving the length unchanged and the bytes different.
      # CANARY carries plain http:// links or mailto: addresses, which HTTPS Rewrites, Email
      # Obfuscation and Rocket Loader each alter. It is read as libwww-perl, because Browser
      # Integrity Check answers 403 to that client and every other mirror serves it; CURL's -f
      # makes the 403 the failure. Skipped over file://, which has no bucket to read, and until
      # the state holds the path.
      - >-
        {{if .CANARY}}h={{shellQuote .CANARY}}; n=$(awk -F'\t' -v k="$h" '$1 == k { print $2 }' {{.RUN}}/applied.txt 2>/dev/null);
        case "{{.URL}}" in http*) ;; *) n= ;; esac;
        if test -z "$n"; then echo "canary skipped ($h is not in the state, or the URL is not http)"; else
        aws s3 cp {{.AWS_FLAGS}} "{{.S3}}/$h" {{.RUN}}/canary.html &&
        {{.CURL}} -A "libwww-perl/6.67" "{{.URL}}/$h" | cmp - {{.RUN}}/canary.html &&
        echo "$h: $n bytes, served to a libwww-perl client as the bucket holds them"; fi{{else}}echo "no CANARY: the edge's HTML rewriters and client filter go unchecked"{{end}}
      # A stored Content-Encoding tells every client to unpack the file in flight, so a
      # tarball arrives as a tar; GNU's mirror guidelines ask for none. Python guesses
      # ("application/x-tar", "gzip") for foo.tar.gz; this is the check that neither label
      # nor a CLI bump ever stores the second half. The first non-empty .tar.gz in the
      # state, read with no Accept-Encoding, must come back without one; an empty one answers
      # the ranged read with 416, which CURL's -f would fail. Skipped over file:// and when
      # the state holds no such file.
      - >-
        g=$(awk -F'\t' '$1 ~ /\.tar\.gz$/ && $2 > 0 { print $1; exit }' {{.RUN}}/applied.txt 2>/dev/null);
        case "{{.URL}}" in http*) ;; *) g= ;; esac;
        if test -z "$g"; then echo "content-encoding check skipped (no non-empty .tar.gz in the state, or the URL is not http)"; else
        u=$(printf '%s\n' "$g" | {{.ENCODE}} | cut -f2) && h=$({{.CURL}} -r 0-0 -D - -o /dev/null "{{.URL}}/$u") &&
        if printf '%s' "$h" | grep -qi '^content-encoding:'; then echo "$g: served with a content-encoding" >&2; exit 1; fi &&
        echo "$g: served with no content-encoding"; fi
      # A path upstream lists but rsync cannot send (exit 23, which retry passes) never
      # lands, so every run fetches it again and the run stays green. Once every batch has
      # been worked, the delta lines the state still lacks are those: report counts them,
      # and each of the first 20 is a warning on the Actions run.
      - >-
        if test -f {{.RUN}}/changed.txt && test ! -f {{.RUN}}/chain;
        then LC_ALL=C comm -23 {{.RUN}}/changed.txt {{.RUN}}/applied.txt > {{.RUN}}/unlanded.txt; else : > {{.RUN}}/unlanded.txt; fi;
        cut -f1 {{.RUN}}/unlanded.txt | head -20 | while IFS= read -r p; do echo "::warning::listed upstream, never fetched: $p"; done
      # A called task sees none of its caller's call vars, so the three a check reads are
      # handed on; in a run they are the values above, and an offline check passes its own.
      - {task: fresh, vars: {RUN: '{{.RUN}}', URL: '{{.URL}}'}}
      - {task: smoke-mirror, vars: {RUN: '{{.RUN}}', STAGING: '{{.STAGING}}', URL: '{{.URL}}'}}

  fresh:
    desc: With FRESH_KEY set and in the state, read it through the domain and fail the run when the upstream clock in it is FRESH_HOURS (24) old; a source that stalls otherwise leaves every run green
    cmds:
      # The run moved every byte it was given, so only the clock upstream wrote says the
      # bytes are old. gnu reads a secondary, which can stop syncing while answering rsync.
      - >-
        {{if .FRESH_KEY}}k={{shellQuote .FRESH_KEY}};
        if ! awk -F'\t' -v k="$k" '$1 == k { f = 1 } END { exit !f }' {{.RUN}}/applied.txt 2>/dev/null;
        then echo "freshness skipped ($k is not in the state)"; else
        case "{{.FRESH_H}}" in ''|*[!0-9]*) echo "FRESH_HOURS is a whole number" >&2; exit 1 ;; esac;
        u=$(printf '%s\n' "$k" | {{.ENCODE}} | cut -f2);
        t=$({{.CURL}} "{{.URL}}/$u" | {{.STAMP}});
        case "$t" in *-*) t=$(date -u -d "$t" +%s) ;; esac; test -n "$t";
        a=$(( $(date -u +%s) - t )); echo "$a" > {{.RUN}}/fresh.txt;
        echo "$k: upstream's clock $((a / 3600)) h $((a % 3600 / 60)) min ago, limit {{.FRESH_H}} h";
        test "$a" -le $(( {{.FRESH_H}} * 3600 )) || { echo "::error::$k is $((a / 3600)) h old, past FRESH_HOURS {{.FRESH_H}}: upstream or SOURCE has stopped moving"; exit 1; }; fi{{else}}echo "no FRESH_KEY: a source that stops moving goes unnoticed"{{end}}

  smoke-mirror:
    desc: A hook, empty here; a mirror with more to read back than the sample replaces it, and smoke runs it last
    cmds: []

  report-engine:
    desc: The engine's rows of the run summary, appended after the toolbox's
    silent: true
    cmds:
      - |
        n() { test -f "$1" && wc -l < "$1" || echo 0; }
        gb() { test -f "$1" && awk -F'\t' '{ s += $2 } END { printf "%.2f", s / 1e9 }' "$1" || echo 0.00; }
        cat >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}" <<EOF
        | Mirror | $(n {{.RUN}}/upstream.txt) objects, $(gb {{.RUN}}/upstream.txt) GB upstream, at [{{.URL}}/]({{.URL}}/) |
        | Delta | $(n {{.RUN}}/changed.txt) new or changed in $(ls {{.RUN}}/batch-*.txt 2>/dev/null | wc -l | awk -v m={{.BATCHES_MAX}} '{ print $1 " batches" ($1 > m ? ", " $1 - m " left for the next run" : "") }'); $(n {{.RUN}}/deleted.txt) deleted, $(n {{.RUN}}/orphans.txt) orphaned |
        | Published to R2 | $(awk '/^upload:/ { n++ } END { print n + 0 }' {{.RUN}}/publish.txt 2>/dev/null || echo 0) uploaded, $(cut -f2 {{.RUN}}/labeled.txt 2>/dev/null | sort -u | wc -l | tr -d ' ') types |
        | State | $(n {{.RUN}}/applied.txt) lines in {{.STATE}} |
        | Storage | $(test -f {{.RUN}}/bucket.txt && echo "$(gb {{.RUN}}/bucket.txt) GB in $(n {{.RUN}}/bucket.txt) objects (reconciled)" || echo "not measured this run"){{if .CEILING_GB}} of the {{.CEILING_GB}} GB ceiling{{end}} |
        EOF
      # prepare made RUN/tl, so the delta touched the signed subtree.
      - test ! -d {{.RUN}}/tl || echo "| Signature | $(test -f {{.RUN}}/tl/tlpkg/texlive.tlpdb && echo "tlpdb signed by {{.TL_KEY}}; $(test -f {{.RUN}}/tl/missing.txt && wc -l < {{.RUN}}/tl/missing.txt || echo 0) named containers missing from the bucket" || echo "the tlpdb did not verify") |" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
      # With INDEX set, what index drew and removed.
      - test -z "{{.INDEX}}" || echo "| Directory pages | $(test -f {{.RUN}}/index-make.txt && wc -l < {{.RUN}}/index-make.txt || echo 0) redrawn under both keys, $(test -f {{.RUN}}/index-gone.txt && wc -l < {{.RUN}}/index-gone.txt || echo 0) keys removed |" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
      # Rows that appear only when they have something to say.
      - test ! -s {{.RUN}}/unlanded.txt || echo "| Never landed | $(wc -l < {{.RUN}}/unlanded.txt | tr -d ' ') listed upstream that rsync could not send, fetched again every run; the first are warnings on the run |" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
      - test ! -f {{.RUN}}/fresh.txt || echo "| Upstream clock | $(awk '{ printf "%d h %d min", $1 / 3600, $1 % 3600 / 60 }' {{.RUN}}/fresh.txt) old in {{.FRESH_KEY}}, limit {{.FRESH_H}} h |" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

  retry:
    desc: Run CMD, retrying rsync's transport exit codes (5 10 12 30 35) five times with backoff and jitter; 23 (a path it could not read, a dangling symlink under -L) and 24 (file vanished mid-transfer) are successes
    cmds:
      - |
        for i in 1 2 3 4 5; do
          rc=0; ( {{.CMD}} ) || rc=$?   # subshell so CMD's exit cannot end the loop; || so Task's errexit cannot
          case $rc in 0|23|24) exit 0;; 5|10|12|30|35) ;; *) exit $rc;; esac
          test $i -lt 5 || break
          s=$(({{.RETRY_S}} * 2 ** i + RANDOM % (2 * {{.RETRY_S}} + 1))); echo "rsync exit $rc, retry $i in ${s}s" >&2; sleep $s
        done; exit $rc
