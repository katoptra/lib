# The proton engine: how bytes move from a staging tree into one Proton Drive folder. It
# is for each mirror that includes this file and the toolbox with `flatten: true`. A run
# does these steps:
#   1. It gets the session of the Proton CLI from the bucket.
#   2. It makes sure that the destination is the folder that the vault identifies.
#   3. It lets the mirror fill the staging tree.
#   4. It uploads the tree in one CLI command. The CLI does not send a file when Proton
#      has its content, and it makes a new revision of a file that changed.
#   5. confirm examines the summary of the CLI for the upload.
#   6. It lets the mirror prune the files that its upstream removed.
#   7. It reports.
# Proton keeps the version history. Thus, the bucket holds only the session of the mirror.
#
# The engine reads these names from the environment. Each Proton mirror uses these names
# in its op.env:
#   - MIRROR_PROTON_DESTINATION: the CLI path of the destination folder, for example
#     /my-files/GitHub.
#   - MIRROR_PROTON_DESTINATION_UID: the UID of that folder. Each run compares it before
#     it writes to Proton.
#   - MIRROR_R2_BUCKET
#   - MIRROR_AGE_IDENTITY
#   - the three AWS_* names that boto3 reads, with AWS_ENDPOINT_URL_S3 for the endpoint.
# Each name is a line of op.env. Thus, it goes into the container with its name.
#
# Hooks:
#   - stage fills STAGING. Each mirror writes this verb.
#   - prune moves the files that upstream removed to the Proton trash. A mirror that wants
#     this writes the verb.
#   - report-engine gives the rows of the engine in the run summary.
# A mirror puts each hook that it writes in `excludes:` on this include. pipeline and
# plan-pipeline put the verbs in sequence. For a different sequence, a mirror puts these
# two in `excludes:` and writes them again.
#
# Rules that this file and the toolbox obey:
#   - No `vars:` default for a value that a mirror sets.
#   - After each CLI command, for all exit codes, the engine examines the CLI session.
#     When the refresh token changed, the engine writes the session back to the bucket.
#     The CLI can change the refresh token. If a run keeps a changed token and does not
#     write it back, the next run cannot log in.
version: '3'

vars:
  # The engine sets its image. The IMAGE on the toolbox include must be the image that the
  # run uses, for example the -dev image of a lib example. Thus, this value is a default.
  # A literal value here can replace the IMAGE of the include, because go-task merges
  # sibling includes in a random sequence for each run.
  IMAGE: '{{.IMAGE | default "ghcr.io/katoptra/toolbox:proton-v2"}}'
  # SESSION and UPLOAD write ROOT_DIR/.run in full, and they do not read RUN, the var of
  # the toolbox. For a root task, go-task calculates the vars of sibling includes in a
  # sequence that changes from run to run (examined on 3.53.1 and 3.54.0). Thus, RUN can
  # be unset when go-task calculates these two.
  SESSION: '{{.ROOT_DIR}}/.run/session'
  SESSION_KEY: .state/session.tar.age
  UPLOAD: '{{.ROOT_DIR}}/.run/upload.json'
  # The CLI keeps its session as files in RUN/session. The image sets the file store
  # (`unsafe_file`), because the image has no keyring.
  PD: PROTON_DRIVE_CACHE_DIR={{.SESSION}} proton-drive

tasks:
  pipeline:
    desc: clock -> session -> destination -> stage -> upload -> confirm -> prune -> report -> ping
    cmds:
      - {task: clock}
      - {task: session}
      - {task: destination}
      - {task: stage}
      - {task: upload}
      - {task: confirm}
      - {task: prune}
      - {task: report}
      - {task: ping}

  plan-pipeline:
    desc: 'The read-only half: clock -> session -> destination -> stage, then what an upload would carry'
    cmds:
      - {task: clock}
      - {task: session}
      - {task: destination}
      - {task: stage}
      - |
        find {{.STAGING}} -type f -printf '%s\n' | awk '{ n++; s += $1 } END { printf "plan: %d files, %.1f MB staged\n", n, s / 1e6 }'

  # ---- the session ----
  session:
    desc: Restore the Proton CLI session from the bucket into RUN/session
    cmds:
      - rm -rf {{.SESSION}} && mkdir -p {{.SESSION}} && chmod 700 {{.SESSION}}
      - {task: pull, vars: {KEY: '{{.SESSION_KEY}}', OUT: '{{.RUN}}/session.tar.age', MISSING: 'echo "no Proton session at {{.SESSION_KEY}}: log in on a laptop and run task session-seal" >&2; exit 1'}}
      - {task: age, vars: {MODE: decrypt, IN: '{{.RUN}}/session.tar.age', OUT: '{{.RUN}}/session.tar'}}
      # tar gets only the two members that the CLI uses from the archive. Other files that
      # the archive can hold stay in it.
      - tar -xf {{.RUN}}/session.tar -C {{.SESSION}} auth-session.json clientUid.json && chmod 600 {{.SESSION}}/*.json
      - rm -f {{.RUN}}/session.tar {{.RUN}}/session.tar.age
      - sha256sum {{.SESSION}}/auth-session.json > {{.RUN}}/session.sha

  session-push:
    desc: Seal RUN/session back into the bucket when the CLI rotated its token since the last push
    internal: true
    status: ['sha256sum --status -c {{.RUN}}/session.sha']
    cmds:
      - 'echo "session: token rotated, sealing it back to the bucket"'
      - {task: seal, vars: {DIR: '{{.SESSION}}'}}
      - sha256sum {{.SESSION}}/auth-session.json > {{.RUN}}/session.sha

  seal:
    desc: 'The two session files of DIR, tarred and age-encrypted, to the bucket: task seal DIR=.run/pd'
    requires: {vars: [DIR]}
    cmds:
      - defer: rm -f {{.RUN}}/session.tar {{.RUN}}/session.tar.age
      - mkdir -p {{.RUN}} && tar -cf {{.RUN}}/session.tar -C {{.DIR}} auth-session.json clientUid.json
      - {task: age, vars: {MODE: encrypt, IN: '{{.RUN}}/session.tar', OUT: '{{.RUN}}/session.tar.age'}}
      - {task: push, vars: {FILE: '{{.RUN}}/session.tar.age', KEY: '{{.SESSION_KEY}}'}}

  session-seal:
    desc: 'Encrypt a laptop Proton CLI session into the bucket: task session-seal -- .run/pd'
    cmds:
      - {task: op, vars: {ARGS: 'task seal DIR={{.CLI_ARGS}}'}}

  age:
    desc: age MODE (encrypt or decrypt) IN to OUT with MIRROR_AGE_IDENTITY, which touches disk for the call alone, mode 0600
    internal: true
    requires: {vars: [MODE, IN, OUT]}
    cmds:
      - |
        test -n "$MIRROR_AGE_IDENTITY" || { echo "MIRROR_AGE_IDENTITY is unset" >&2; exit 1; }
        k={{.RUN}}/age.key; mkdir -p {{.RUN}}; install -m 600 /dev/null "$k" && printf '%s\n' "$MIRROR_AGE_IDENTITY" > "$k"
        rc=0
        case {{.MODE}} in
          encrypt) age -r "$(age-keygen -y "$k")" -o {{.OUT}} {{.IN}} || rc=$? ;;
          decrypt) age -d -i "$k" -o {{.OUT}} {{.IN}} || rc=$? ;;
          *) echo "age: MODE must be encrypt or decrypt" >&2; rc=2 ;;
        esac
        rm -f "$k"; exit $rc

  # ---- the bucket ----
  pull:
    desc: KEY from the bucket to OUT; MISSING runs when the bucket has no such key
    internal: true
    requires: {vars: [KEY, OUT, MISSING]}
    cmds:
      - |
        rc=0; s3 get {{.KEY}} {{.OUT}} || rc=$?
        case $rc in 0) ;; 3) {{.MISSING}} ;; *) exit $rc ;; esac

  push:
    desc: FILE to the bucket's KEY as one PutObject
    internal: true
    requires: {vars: [FILE, KEY]}
    cmds:
      - s3 put {{.FILE}} {{.KEY}}

  # ---- the CLI ----
  # This verb does each CLI command:
  #   1. The stderr of the command goes to RUN/pd.err, not to the run log, which all
  #      persons can read.
  #   2. session-push operates, for all exit codes. It writes the session back when the
  #      refresh token changed.
  #   3. The verb compares the exit with OK: the exit codes, other than 0, that it
  #      accepts.
  # Only list-folder is different: its ARGS end with `|| echo "[]" > OUT`. Thus, the `2>`
  # is on the echo, and the stderr of the CLI goes to the run log.
  pd:
    desc: One CLI call, ARGS, with the session written back afterwards
    internal: true
    requires: {vars: [ARGS]}
    cmds:
      - rc=0; {{.PD}} {{.ARGS}} 2> {{.RUN}}/pd.err || rc=$?; echo $rc > {{.RUN}}/pd.rc
      - {task: session-push}
      - |
        rc=$(cat {{.RUN}}/pd.rc)
        case " {{.OK | default 0}} " in *" $rc "*) exit 0 ;; esac
        echo "proton-drive exited $rc; its stderr, $(wc -l < {{.RUN}}/pd.err) lines, is in .run/pd.err" >&2; exit $rc

  destination:
    desc: Refuse the run unless MIRROR_PROTON_DESTINATION resolves to exactly one folder whose UID is MIRROR_PROTON_DESTINATION_UID
    cmds:
      - defer: rm -f {{.RUN}}/parent.json
      - {task: pd, vars: {ARGS: 'filesystem list -j "$(dirname "$MIRROR_PROTON_DESTINATION")" > {{.RUN}}/parent.json'}}
      # ponytail: the command finds the folder with its basename. Thus, the engine cannot
      # use a destination with a slash in its name. The CLI puts a backslash before such a
      # slash, and dirname does not.
      - |
        python3 - "$(basename "$MIRROR_PROTON_DESTINATION")" "$MIRROR_PROTON_DESTINATION_UID" {{.RUN}}/parent.json <<'PY'
        import json, sys
        name, uid, path = sys.argv[1:]
        unwrap = lambda v: v.get("value") if isinstance(v, dict) else v
        nodes = json.load(open(path))
        found = [n for n in nodes if isinstance(n, dict) and unwrap(n.get("name")) == name]
        if len(found) != 1 or unwrap(found[0].get("type")) != "folder":
            sys.exit(f"destination: {len(found)} folder(s) of that name among {len(nodes)} entries of the parent; expected exactly one")
        if not uid or str(unwrap(found[0].get("uid")) or "") != uid:
            sys.exit("destination: the folder's UID is not the one the vault names")
        print("destination: the folder and its UID match the vault")
        PY

  upload:
    desc: STAGING into the destination in one CLI call; identical files are skipped, changed ones become new revisions; the CLI's summary goes to RUN/upload.json
    cmds:
      - 'test -n "$(ls -A {{.STAGING}} 2>/dev/null)" || { echo "upload: staging is empty; stage put nothing there" >&2; exit 1; }'
      # Exit 1: the CLI rejected some items and did the others. confirm reads the summary.
      - {task: pd, vars: {ARGS: 'filesystem upload -f create-new-revision -d merge -t --json {{.STAGING}}/* "$MIRROR_PROTON_DESTINATION" > {{.UPLOAD}}', OK: '0 1'}}

  confirm:
    desc: The CLI's summary must account for every staged file and folder, with no failures; the verdict goes to RUN/confirm.txt
    cmds:
      - |
        files=$(find {{.STAGING}} -type f | wc -l); folders=$(find {{.STAGING}} -mindepth 1 -type d | wc -l)
        python3 - "$files" "$folders" {{.UPLOAD}} {{.RUN}}/confirm.txt <<'PY'
        import json, sys
        files, folders = int(sys.argv[1]), int(sys.argv[2])
        # While the upload continues, the CLI writes one JSON object on each line. Its
        # summary is also one JSON object on a line. The last line with transferredItems
        # is the summary.
        summary = None
        for line in open(sys.argv[3]):
            try:
                candidate = json.loads(line)
            except ValueError:
                continue
            if isinstance(candidate, dict) and "transferredItems" in candidate:
                summary = candidate
        if summary is None:
            sys.exit("confirm: no upload summary in the CLI's output")
        t, s, f = (int(summary.get(k, 0) or 0) for k in ("transferredItems", "skippedItems", "failedItems"))
        verdict = f"{t} uploaded as new files or revisions, {s} skipped as identical, {f} failed, of {files} files in {folders} folders staged"
        ok = f == 0 and t + s == files + folders
        open(sys.argv[4], "w").write(verdict + ("" if ok else " (not confirmed)") + "\n")
        print("confirm: " + verdict)
        sys.exit(0 if ok else 1)
        PY

  list-folder:
    desc: The JSON listing of the Proton folder FOLDER to OUT; a folder the CLI cannot list gives an empty one, so a caller prunes nothing
    internal: true
    requires: {vars: [FOLDER, OUT]}
    cmds:
      - {task: pd, vars: {ARGS: 'filesystem list -j "{{.FOLDER}}" > {{.OUT}} || echo "[]" > {{.OUT}}'}}

  trash:
    desc: Trash the Proton nodes at PATHS, CLI paths space separated; Proton's trash keeps them
    status: ['test -z "{{.PATHS}}"']
    cmds:
      - {task: pd, vars: {ARGS: 'filesystem trash {{.PATHS}}'}}

  empty-trash:
    desc: Permanently delete everything in Proton Drive's trash, inside the toolbox; asks first, never scheduled
    prompt: This permanently deletes everything in Proton Drive trash. Continue?
    cmds:
      - {task: op, vars: {ARGS: task empty-trash-pipeline}}

  # empty-trash uses `task op` to start this task in the image. go-task does not start an
  # internal task from the command line. Thus, this task is not internal.
  empty-trash-pipeline:
    cmds:
      - {task: clock}
      - {task: session}
      - {task: pd, vars: {ARGS: filesystem empty-trash}}

  # ---- hooks ----
  stage: {cmds: []}   # the mirror fills STAGING with the files that Proton must hold
  prune: {cmds: []}   # the mirror moves the files that its upstream removed to the trash

  report-engine:
    desc: The engine's rows of the run summary, appended after the toolbox's
    silent: true
    cmds:
      - |
        staged=$(find {{.STAGING}} -type f 2>/dev/null | wc -l)
        mb=$(find {{.STAGING}} -type f -printf '%s\n' 2>/dev/null | awk '{ s += $1 } END { printf "%.1f", s / 1e6 }')
        cat >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}" <<EOF
        | Staged | $staged files, $mb MB |
        | Proton | $(cat {{.RUN}}/confirm.txt 2>/dev/null || echo "not confirmed this run") |
        | Session | $(test -f {{.RUN}}/session.sha && echo "restored, and sealed back on rotation" || echo "not restored") |
        EOF
