# The toolbox: the verbs that each katoptra mirror has, independently of the code that
# moves its bytes. A mirror includes this file with `flatten: true`, and it sets NAME and
# DESC on the include. It also sets IMAGE there, unless the engine sets IMAGE. The mirror
# keeps the values that identify it in its root vars.
#
# Three verbs are not in this file, and they operate in IMAGE: pipeline, plan-pipeline and
# report-engine. An engine include supplies them. A mirror with no engine writes them in
# its Taskfile. To replace a verb here, a mirror puts its name in `excludes:` on the
# include and writes a verb with that name.
#
# Rules that this file obeys:
#   - No `vars:` default for a value that a mirror sets. With a default here, task does
#     not use the value of the mirror. Each default is inline.
#   - The verbs on the host and the verbs in the container use one namespace. Thus, the
#     names of the verbs in this file are not available for other verbs. The names that an
#     engine include adds are also not available:
#       - The rsync engine: pipeline, plan-pipeline, list, normalise, state, pull, push,
#         rebuild, diff and split. Also batches, batch, fetch, publish, label,
#         label-trees, merge, checkpoint, remove, delete, reconcile, retry, pages, smoke
#         and fresh. Its hooks are prepare, verify, index, smoke-mirror and report-engine.
#       - The proton engine: pipeline, plan-pipeline, session, session-push, seal,
#         session-seal, age, pull, push, pd, destination, upload, confirm, list-folder,
#         trash, empty-trash and empty-trash-pipeline. Its hooks are stage, prune and
#         report-engine.
version: '3'

vars:
  RUN: '{{.ROOT_DIR}}/.run'
  STAGING: '{{.ROOT_DIR}}/staging'
  # The container runtime, not the sync engine. It is Apple container when the daemon of
  # Apple container operates. If not, it is Docker. ENGINE=docker always selects Docker.
  ENGINE:
    sh: |
      if [ -n "$ENGINE" ]; then echo "$ENGINE"
      elif command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then echo container
      else echo docker; fi
  # Only names go into the container. No value is on a command line. The names are:
  #   - each name in op.env
  #   - each name in the PASS list of the mirror
  #   - the names that the Actions job summary uses.
  PASS_ENV:
    sh: |
      { test -f {{.ROOT_DIR}}/op.env && grep -v '^#' {{.ROOT_DIR}}/op.env | sed -n 's/=.*//p'; true; } | sed 's/^/-e /' | tr '\n' ' '
      for v in {{.PASS}} GITHUB_STEP_SUMMARY GITHUB_RUN_ID HEALTHCHECK_URL; do printf '%s %s ' -e "$v"; done
  # The image variant is the part of the tag before its version:
  # ghcr.io/katoptra/toolbox:rsync-v2 -> rsync.
  VARIANT:
    sh: echo "{{.IMAGE}}" | sed 's/.*://; s/-v[0-9].*//; s/-dev$//'
  # The container gets the top level of the repository at /work. The working directory is
  # the directory of the Taskfile. For a mirror, these two are the same. For the examples
  # in katoptra/lib, the include two levels up (../../toolbox.yml) must be available in
  # the container.
  TOP:
    sh: git -C {{.ROOT_DIR}} rev-parse --show-toplevel 2>/dev/null || echo {{.ROOT_DIR}}
  PREFIX:
    sh: git -C {{.ROOT_DIR}} rev-parse --show-prefix 2>/dev/null || true

tasks:
  default:
    desc: Print the menu
    silent: true
    # ponytail: a menu that we write manually. go-task cannot put verbs in groups, and it
    # cannot add a comment to a verb. Thus, each new verb must have a line in the menu.
    # `task --list` stays the view that go-task makes.
    cmds:
      - |
        b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        printf '%s\n' \
          "" \
          "${b}{{.NAME}}${r}   ${d}{{.DESC}}${r}" \
          "" \
          "${c}pipeline -- needs the vault (op.env) or the secrets in your environment${r}" \
          "  task sync -- [K=v ...]    One run: task pipeline inside the toolbox, with these vars" \
          "  task plan -- [K=v ...]    The read-only half: task plan-pipeline inside the toolbox" \
          "" \
          "${c}checks -- offline, no credentials${r}" \
          "  task check                Render every command of the pipeline and diff it against render.txt" \
          "  task render-update        Accept the current render as render.txt" \
          "  task --list               The pipeline's own verbs" \
          "" \
          "${c}toolbox -- {{.ENGINE}}, image {{.IMAGE}}${r}" \
          "  task image                Pull it (a no-op while it exists locally)" \
          "  task image-build          Build it from a local checkout of katoptra/lib (LIB_DIR=../lib)" \
          "  task image-clean          Remove it, so the next task pulls or builds again" \
          "  task run -- <cmd>         Run anything inside it, with this repo at /work" \
          "  task op -- <cmd>          Same, with secrets resolved by name from op.env" \
          "  task clean                Delete .run, staging and the Taskfile cache" \
          {{.MENU}} \
          ""

  # ---- toolbox ----
  image:
    desc: Pull the toolbox image
    run: once
    status: ['{{.ENGINE}} image inspect {{.IMAGE}} >/dev/null 2>&1']
    cmds:
      # `image pull`, not `pull`: Apple container has no top-level `pull`. Docker has the
      # two.
      - '{{.ENGINE}} image pull {{.IMAGE}}'

  image-build:
    desc: 'Build the toolbox image from a local katoptra/lib checkout: task image-build LIB_DIR=../lib'
    cmds:
      - '{{.ENGINE}} build -t {{.IMAGE}} -f {{.LIB_DIR | default "../lib"}}/docker/{{.VARIANT}}.Dockerfile {{.LIB_DIR | default "../lib"}}'

  image-clean:
    desc: Remove the toolbox image
    cmds:
      - '{{.ENGINE}} image rm {{.IMAGE}}'

  run:
    desc: 'Run a command inside the toolbox with the repo at /work: task run -- task --list'
    deps: [image]
    # No -i and no -t. After a run that attaches stdin or a tty, Apple container lets the
    # host terminal stay in non-blocking mode. Without these flags, the output continues
    # to show while the command operates, and Ctrl-C continues to stop it.
    #
    # GITHUB_STEP_SUMMARY is a path on the host. The container gets it at the same path
    # that its value gives.
    #
    # The command uses shellQuote on each argument. Thus, the container gets the arguments
    # of `task run -- sh -c 'a; b'` with no change.
    cmds:
      - >-
        {{.ENGINE}} run --rm
        --user $(id -u):$(id -g)
        -v "{{.TOP}}":/work -w /work/{{.PREFIX}}
        ${GITHUB_STEP_SUMMARY:+-v "$GITHUB_STEP_SUMMARY":"$GITHUB_STEP_SUMMARY"}
        -e HOME=/tmp {{.PASS_ENV}}
        {{.IMAGE}} {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}

  op:
    desc: 'Run a command inside the toolbox with secrets from 1Password: task op -- task pipeline'
    vars:
      # sync and plan set ARGS. Manually, the command is the words after --. CMD uses
      # shellQuote on each word. Thus, the container gets the arguments of
      # `task op -- sh -c 'a; b'` with no change.
      CMD: '{{if .ARGS}}{{.ARGS}}{{else}}{{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}{{end}}'
    cmds:
      # With no op.env, the secrets are in the environment before this command starts (for
      # example, GitHub secrets).
      - |
        if test -f op.env; then op run --env-file=op.env -- task run -- {{.CMD}}
        else task run -- {{.CMD}}; fi

  clean:
    desc: Delete .run, the engine's staging tree and the Taskfile cache; nothing else, so a fixture kept in .git/info/exclude survives
    cmds:
      - rm -rf {{.RUN}} {{.STAGING}} {{.ROOT_DIR}}/.task

  # ---- pipeline ----
  # The words after -- are task vars for the pipeline in the image, for example
  # `task sync -- MAX_BATCHES=8 RECONCILE=true`. A KEY=value before -- sets only a var on
  # the host.
  #
  # The failure path operates in the same container. Thus, a run reads 1Password only one
  # time, also after a pipeline failure. A second `op run` for the ping reads it a second
  # time.
  sync:
    desc: 'One run, inside the toolbox: task sync -- [K=v ...]'
    cmds:
      - task: op
        vars: {ARGS: "sh -c 'task pipeline \"$@\" || { task failed; exit 1; }' sh {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}"}

  plan:
    desc: 'The read-only half, inside the toolbox: task plan -- [K=v ...]'
    cmds:
      - task: op
        vars: {ARGS: 'task plan-pipeline {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}'}

  # ---- checks ----
  render:
    desc: Render every command of the pipeline inside the toolbox, run none, save to .run/render.txt
    deps: [image]
    # This verb does not use `run`:
    #   - The output is the artifact. Thus, the verb writes the output to a file, and it
    #     does not show the output while task operates.
    #   - A dry run uses no secrets. Thus, no names go into the container.
    #
    # task writes the rendered commands to stderr. The redirect in the container sends
    # them to stdout. Thus, the lines that the container engine writes to the stderr of
    # the host do not go into the file.
    #
    # The verb puts an empty directory at .run in the container. A var that task reads
    # from .run when it parses the Taskfile (for example, the batch list of an engine)
    # thus renders the same in all working trees. This is also correct for a tree that
    # holds the .run of a plan.
    cmds:
      - mkdir -p {{.RUN}}
      - >-
        empty=$(mktemp -d) &&
        {{.ENGINE}} run --rm --user $(id -u):$(id -g) -v "{{.TOP}}":/work -v "$empty":/work/{{.PREFIX}}.run -w /work/{{.PREFIX}}
        -e HOME=/tmp {{.IMAGE}} sh -c 'task --dry --force pipeline 2>&1' > {{.RUN}}/render.txt;
        rc=$?; rmdir "$empty" 2>/dev/null; exit $rc
      - cat {{.RUN}}/render.txt

  check:
    desc: render, then diff against the committed render.txt
    cmds:
      - task: render
      - 'diff -u render.txt {{.RUN}}/render.txt && echo "check: render matches render.txt"'

  render-update:
    desc: render, then accept it as render.txt
    cmds:
      - task: render
      - cp {{.RUN}}/render.txt render.txt

  # ---- in the toolbox ----
  clock:
    desc: Record the run's start epoch in .run/start.txt, and forget the last run's chain file and reconcile decision
    # The batches verb of an engine writes the chain file when there is more work. When
    # the chain file is there, the workflow queues the next run. A run that does no
    # batches must not get the chain file of the last run. A pipeline without due must not
    # get the .run/reconcile of the last run.
    cmds:
      - mkdir -p {{.RUN}} && rm -f {{.RUN}}/chain {{.RUN}}/reconcile && date -u +%s > {{.RUN}}/start.txt

  # The time since the last reconcile sets when a reconcile is due. The hour or the day
  # that a run starts does not, because the schedule is not in the mirror and its times
  # can change. The last reconcile is the start epoch of the run that completed it. The
  # pull and push verbs of the engine keep it at .state/reconciled. The rsync engine
  # compresses it and its state with xz. A mirror with no engine that reconciles writes
  # these two verbs in its Taskfile.
  #   - RECONCILE=true always reconciles.
  #   - RECONCILE=false does not reconcile.
  #   - RECONCILE=auto, the default, reconciles when the time since the last reconcile is
  #     RECONCILE_HOURS or more, or when there is no last reconcile. RECONCILE_HOURS is
  #     24, or the root var of the mirror.
  due:
    desc: Decide whether this run reconciles, leaving .run/reconcile when it does; RECONCILE=true always, false never, auto once the last reconcile is RECONCILE_HOURS (24) old
    cmds:
      - {task: pull, vars: {KEY: .state/reconciled, OUT: '{{.RUN}}/reconciled', MISSING: ': > {{.RUN}}/reconciled'}}
      - {task: due-rule}

  due-rule:
    desc: The rule due applies, over .run/start.txt and .run/reconciled
    cmds:
      # The limit is 30 minutes less than RECONCILE_HOURS. A daily run starts some seconds
      # before or after 24 h from the run before it. If the limit is 24 h, a reconcile
      # occurs only each second day. A last time that is not a number counts as no
      # reconcile. The shell reads a number that starts with a zero as octal. Thus, the
      # two values must not start with a zero.
      - |
        rm -f {{.RUN}}/reconcile
        r={{shellQuote (.RECONCILE | default "auto")}}; h={{.RECONCILE_HOURS | default 24}}
        now=$(cat {{.RUN}}/start.txt); last=$(cat {{.RUN}}/reconciled 2>/dev/null || true)
        case $last in ''|0?*|*[!0-9]*) last=0 ;; esac
        case $h in ''|0*|*[!0-9]*) echo "due: RECONCILE_HOURS is a whole number of hours from 1, not $h" >&2; exit 1 ;; esac
        case $r in
          true) touch {{.RUN}}/reconcile ;;
          false) ;;
          auto) test $(( now - last )) -lt $(( h * 3600 - 1800 )) || touch {{.RUN}}/reconcile ;;
          *) echo "due: RECONCILE is true, false or auto" >&2; exit 1 ;;
        esac
        test "$last" = 0 && ago="none on record" || ago="$(( (now - last) / 3600 )) h ago"
        echo "due: RECONCILE=$r RECONCILE_HOURS=$h, last reconcile $ago: $(test -f {{.RUN}}/reconcile && echo reconciling || echo not this run)"

  reconciled:
    desc: Record this run's start at .state/reconciled as the last reconcile; an engine runs it once a reconcile completes
    cmds:
      - cp {{.RUN}}/start.txt {{.RUN}}/reconciled
      - {task: push, vars: {FILE: '{{.RUN}}/reconciled', KEY: .state/reconciled}}

  ping:
    desc: Dead man's switch; healthchecks.io emails when its grace passes without this (skipped if HEALTHCHECK_URL is unset)
    cmds:
      - test -z "$HEALTHCHECK_URL" || curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"

  ping-fail:
    desc: Tell healthchecks.io the run failed (skipped if HEALTHCHECK_URL is unset)
    cmds:
      - test -z "$HEALTHCHECK_URL" || curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL/fail"

  # One verb. Thus, the workflow can also start it when the runner stopped a run:
  #   - after a timeout
  #   - after a cancellation
  #   - after an image pull that did not complete.
  # sync starts it in the container of the pipeline.
  failed:
    desc: 'The failure path: the run summary marked failed, then the fail ping'
    cmds:
      - task report STATUS=failed || true
      - {task: ping-fail}

  # One table, in three layers, in this sequence:
  #   1. the rows of this verb
  #   2. the rows of the engine
  #   3. the rows of the mirror.
  # Each row is a "| Label | value |" line, appended to the same file. Each row accepts a
  # missing file, because the report also operates after a pipeline failure.
  report:
    desc: Append the run summary to the Actions job page (stdout elsewhere), base rows then the engine's then the mirror's
    silent: true
    cmds:
      - |
        s=$(cut -d' ' -f1 {{.RUN}}/start.txt 2>/dev/null || date +%s); now=$(date +%s)
        cat >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}" <<EOF
        ## {{.NAME}}: run {{.STATUS | default "succeeded"}}, $(date -u '+%Y-%m-%d %H:%M UTC')

        | | |
        |---|---|
        | Started | $(date -u -d "@$s" '+%H:%M UTC'), took $(( (now - s) / 60 )) min |
        | Image | {{.IMAGE}} |
        | Next run | $(test -f {{.RUN}}/chain && echo "queued now, work remains" || echo "at the schedule") |
        EOF
      - {task: report-engine}
      - {task: report-mirror}
  report-mirror: {cmds: []}   # the rows of the mirror. A mirror can replace this verb.
