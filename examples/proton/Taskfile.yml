# A Taskfile that includes the toolbox and the proton engine, with the proton image. In
# this repo, the includes are paths. A mirror includes these URLs:
#   - https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
#   - https://raw.githubusercontent.com/katoptra/lib/v2/engines/proton.yml
#
# The pipeline is the pipeline of the engine. render.txt holds each command of the
# pipeline. render.txt is the check of the engine in this library.
# `task run -- task offline` does the verbs that use no Proton and no bucket.
version: '3'
includes:
  toolbox:
    taskfile: ../../toolbox.yml
    flatten: true
    vars:
      NAME: example-proton
      DESC: the proton toolbox and engine, exercised
      IMAGE: ghcr.io/katoptra/toolbox:proton-dev
      LIB_DIR: ../..
      MENU: '"" "${c}engine -- offline, inside the image${r}" "  task run -- task offline  confirm over fixtures/, and an age round trip"'
  proton:
    taskfile: ../../engines/proton.yml
    flatten: true
    excludes: [stage, prune]
tasks:
  stage:
    desc: One file in one folder under STAGING, so the pipeline has something to upload
    cmds:
      - rm -rf {{.STAGING}} && mkdir -p {{.STAGING}}/example && printf 'hello\n' > {{.STAGING}}/example/hello.txt
  prune:
    desc: List the folder stage fills and trash nothing, since stage always writes the same file; two commands, so the render covers list-folder and trash
    cmds:
      - {task: list-folder, vars: {FOLDER: '$MIRROR_PROTON_DESTINATION/example', OUT: '{{.RUN}}/example.json'}}
      - {task: trash, vars: {PATHS: ''}}
  tools:
    desc: Every tool the proton image promises, by version
    cmds:
      - python --version
      - proton-drive version | head -1
      - age --version
      - git --version
      - python -c 'import boto3, requests; print(boto3.__version__, requests.__version__)'
      - ruff --version
      - pytest --version
      - s3 2>&1 | head -1
  offline:
    desc: The engine's verbs that need neither Proton nor a bucket, inside the image
    cmds:
      # confirm: one file in one folder in staging. confirm accepts a summary that gives the
      # two, with no failure. confirm rejects a summary that shows a failure.
      - {task: stage}
      - cp {{.ROOT_DIR}}/fixtures/upload-ok.json {{.UPLOAD}}
      - {task: confirm}
      - grep -q 'skipped as identical, 0 failed' {{.RUN}}/confirm.txt
      - cp {{.ROOT_DIR}}/fixtures/upload-failed.json {{.UPLOAD}}
      - if task confirm >/dev/null 2>&1; then echo "confirm accepted a summary with a failure" >&2; exit 1; fi
      - grep -q '(not confirmed)' {{.RUN}}/confirm.txt
      # empty-trash: the host verb starts empty-trash-pipeline with its name in the image. A
      # dry run shows that go-task accepts that name from the command line.
      - task --dry empty-trash-pipeline >/dev/null 2>&1 || { echo "empty-trash-pipeline is internal" >&2; exit 1; }
      # age: with the verb of the engine, a temporary identity encrypts a file and then
      # decrypts it. After that, the identity file is not there.
      - MIRROR_AGE_IDENTITY="$(age-keygen 2>/dev/null)" task age-roundtrip
      - test ! -e {{.RUN}}/age.key
      - 'echo "offline: every check passed"'
  age-roundtrip:
    desc: encrypt then decrypt RUN/plain.txt through the engine's age verb, and compare
    cmds:
      - printf 'round trip\n' > {{.RUN}}/plain.txt
      - {task: age, vars: {MODE: encrypt, IN: '{{.RUN}}/plain.txt', OUT: '{{.RUN}}/plain.age'}}
      - {task: age, vars: {MODE: decrypt, IN: '{{.RUN}}/plain.age', OUT: '{{.RUN}}/plain.out'}}
      - cmp {{.RUN}}/plain.txt {{.RUN}}/plain.out
