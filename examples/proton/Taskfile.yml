# A consumer of the toolbox with the proton image. No engine, so the mirror defines the
# two pipeline verbs itself, from the toolbox's clock, report and ping and its own steps.
version: '3'
includes:
  toolbox:
    taskfile: ../../toolbox.yml
    flatten: true
    vars:
      NAME: example-proton
      DESC: the proton toolbox, exercised
      IMAGE: ghcr.io/katoptra/toolbox:proton-dev
      LIB_DIR: ../..
tasks:
  pipeline:
    desc: clock -> tools -> report -> ping
    cmds:
      - {task: clock}
      - {task: tools}
      - {task: report}
      - {task: ping}
  plan-pipeline:
    desc: 'The read-only half: clock -> tools'
    cmds:
      - {task: clock}
      - {task: tools}
  tools:
    desc: Every tool the proton image promises, by version
    cmds:
      - python --version
      - proton-drive version | head -1
      - age --version
      - python -c 'import boto3, requests; print(boto3.__version__, requests.__version__)'
      - ruff --version
      - pytest --version
