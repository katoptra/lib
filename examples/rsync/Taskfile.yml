# A consumer of the toolbox and the rsync engine, with the rsync image. Inside this repo
# the includes are paths; a mirror includes
# https://raw.githubusercontent.com/katoptra/lib/v1/toolbox.yml and
# https://raw.githubusercontent.com/katoptra/lib/v1/engines/rsync.yml. The pipeline is
# the engine's; render.txt, every command of it, is the library's own check of the engine,
# and `task run -- task offline` runs the verbs that need no bucket over fixtures/.
version: '3'
vars:
  SOURCE: rsync://rsync.example.org/pub/
  BUCKET: example
  HOST: example.katoptra.org
  LIST_FLOOR: 1
  INDEX: '{{.HOST}}.directory.index.html'
  PAGE_FOOT: 'A mirror of rsync.example.org/pub/. <a href="https://example.org/issues">Report a problem</a>.'
  CANARY: pub/index.html
includes:
  toolbox:
    taskfile: ../../toolbox.yml
    flatten: true
    excludes: [report-engine]   # the engine's
    vars:
      NAME: example-rsync
      DESC: the rsync toolbox and engine, exercised
      IMAGE: ghcr.io/katoptra/toolbox:rsync-dev
      LIB_DIR: ../..
      MENU: '"" "${c}engine -- offline, inside the image${r}" "  task run -- task offline  Every verb that needs no bucket, over fixtures/"'
  rsync:
    taskfile: ../../engines/rsync.yml
    flatten: true
tasks:
  tools:
    desc: Every tool the rsync image promises, by version
    cmds:
      - rsync --version | head -1
      - aws --version
      - gpgv --version | head -1
      - xz --version | head -1
      - shasum --version
  offline:
    desc: Every engine verb that needs no bucket, over fixtures/ copied under .run, inside the image
    vars:
      F: '{{.RUN}}/fixtures'
      # fixtures/tree is a signed subtree, tl/, the shape of TeX Live's: a tlpdb naming one
      # package's containers, its sha512 signed by a throwaway key whose public half is the
      # tree's own keyring, as upstream's is. FP is what a mirror pins as TL_KEY.
      TREE: '{{.ROOT_DIR}}/fixtures/tree/'
      LOCAL: rsync --no-h   # a local tree; the engine's daemon-only flags are a usage error here
      FP: 3505F9E22FF030FE5D9C655A825C376AB4571163
      # run-pages/want/ is ctan's page set for that state as ctan.katoptra.org serves it: its
      # INDEX, and the closing line that links the directory on ctan.org.
      CTAN_INDEX: ctan.katoptra.org.directory.index.html
      CTAN_FOOT: '<a href="https://ctan.org/tex-archive/%s">This directory on ctan.org</a>. Sizes in bytes, times as CTAN lists them.'
    cmds:
      # list and normalise over a local tree: its two regular files, byte-sorted, and no directory.
      - {task: list, vars: {SOURCE: '{{.ROOT_DIR}}/fixtures/run-root/staging/', RSYNC: 'rsync --no-h'}}
      - test "$(cut -f1 {{.RUN}}/upstream.txt | tr '\n' ' ')" = "a/b/f.txt timestamp "
      # The verbs write beside what they read, so they work on a copy.
      - rm -rf {{.F}} && cp -R {{.ROOT_DIR}}/fixtures {{.F}}
      # run-root: the hour in which one bucket-root file changed. diff finds it, merge takes it
      # from staging into the state, and split makes it the one batch, the decision batch.
      - {task: diff, vars: {RUN: '{{.F}}/run-root'}}
      - test "$(cut -f1 {{.F}}/run-root/changed.txt)" = timestamp && test ! -s {{.F}}/run-root/deleted.txt
      - {task: merge, vars: {RUN: '{{.F}}/run-root', STAGING: '{{.F}}/run-root/staging', B: '{{.F}}/run-root/changed.txt'}}
      - cmp {{.F}}/run-root/applied.new {{.F}}/run-root/upstream.txt
      - {task: split, vars: {RUN: '{{.F}}/run-root', STAGING: '{{.F}}/staging'}}
      - test "$(ls {{.F}}/run-root/batch-*.txt | wc -l)" -eq 1 && cmp {{.F}}/run-root/batch-0001.txt {{.F}}/run-root/changed.txt
      # run-empty: the batch names a file that vanished upstream before fetch, so staging never
      # received it; merge drops it, and the state never names a key the bucket lacks.
      - {task: diff, vars: {RUN: '{{.F}}/run-empty'}}
      - {task: merge, vars: {RUN: '{{.F}}/run-empty', STAGING: '{{.F}}/run-empty/staging', B: '{{.F}}/run-empty/changed.txt'}}
      - cmp {{.F}}/run-empty/applied.new {{.F}}/run-empty/applied.txt
      # run-resign: upstream wrote x.exe's sha512 and signature again and left x.exe alone,
      # as TeX Live's nightly build does to its prebuilt installer. diff takes x.exe back
      # into the delta so verify has the file the sha512 names; y.exe, unmoved, stays out.
      - {task: diff, vars: {RUN: '{{.F}}/run-resign', TL: tl}}
      - test "$(cut -f1 {{.F}}/run-resign/changed.txt | tr '\n' ' ')" = "tl/x.exe tl/x.exe.sha512 tl/x.exe.sha512.asc "
      # retry: 23 and 24 are successes, a transport code is retried five times, anything else is final.
      - task retry CMD='exit 23' RETRY_BASE=0
      - task retry CMD='exit 24' RETRY_BASE=0
      - '! task retry CMD=''exit 5'' RETRY_BASE=0 2>/dev/null'
      - '! task retry CMD=''exit 3'' RETRY_BASE=0 2>/dev/null'
      # due-rule, a run starting at 1000000: auto reconciles with none on record and at 23 h
      # 50 min, not at under 3 h, unless RECONCILE_HOURS is 2 or RECONCILE=true; false never
      # does. A RECONCILE that is none of the three stops the run, and so does an hour count
      # that is not a whole number from 1 (08 would read as octal).
      - mkdir -p {{.F}}/due && echo 1000000 > {{.F}}/due/start.txt
      - {task: due-rule, vars: {RUN: '{{.F}}/due'}}
      - test -f {{.F}}/due/reconcile
      - {task: due-rule, vars: {RUN: '{{.F}}/due', RECONCILE: 'false'}}
      - test ! -f {{.F}}/due/reconcile
      - echo 914000 > {{.F}}/due/reconciled
      - {task: due-rule, vars: {RUN: '{{.F}}/due'}}
      - test -f {{.F}}/due/reconcile
      - echo 990000 > {{.F}}/due/reconciled
      - {task: due-rule, vars: {RUN: '{{.F}}/due'}}
      - test ! -f {{.F}}/due/reconcile
      - {task: due-rule, vars: {RUN: '{{.F}}/due', RECONCILE_HOURS: 2}}
      - test -f {{.F}}/due/reconcile
      - {task: due-rule, vars: {RUN: '{{.F}}/due', RECONCILE: 'true'}}
      - test -f {{.F}}/due/reconcile
      - task due-refuses R=yes 2>&1 | grep -q 'RECONCILE is true, false or auto'
      - task due-refuses H=abc 2>&1 | grep -q 'RECONCILE_HOURS is a whole number'
      - task due-refuses H=08 2>&1 | grep -q 'RECONCILE_HOURS is a whole number'
      # run-tl: the signed subtree. prepare fetches the control files from the tree and checks
      # the signed sha512 against the pinned key; fetch stages the batch; verify checks the
      # signed file it carries, every container against the tlpdb under both of its names
      # (three sums: the stable and the revision-stamped container, and the doc container),
      # and, the batch carrying the tlpdb, the decision batch whole. Staged in the engine's
      # own STAGING: verify's dir is fixed when the include is read, so no call var moves it.
      - {task: prepare, vars: {RUN: '{{.F}}/run-tl', SOURCE: '{{.TREE}}', RSYNC: '{{.LOCAL}}', TL: tl, TL_KEY: '{{.FP}}'}}
      - test -f {{.F}}/run-tl/tl/tlpkg/texlive.tlpdb
      - {task: fetch, vars: {RUN: '{{.F}}/run-tl', SOURCE: '{{.TREE}}', RSYNC: '{{.LOCAL}}', B: '{{.F}}/run-tl/batch-0001.txt'}}
      - {task: verify, vars: {RUN: '{{.F}}/run-tl', B: '{{.F}}/run-tl/batch-0001.txt', TL: tl, TL_KEY: '{{.FP}}'}}
      - test "$(wc -l < {{.F}}/run-tl/tl/sums.txt)" -eq 3 && test ! -s {{.F}}/run-tl/tl/missing.txt
      # A container the tlpdb does not describe cannot pass, whatever its bytes.
      - '! task verify-refuses 2>/dev/null'
      # run-pages: the state gained a file whose name carries & < > and a directory whose name
      # carries a space, and lost gone/. pages draws the root, a/, a/b/ and a/sp ace/, each
      # under both of its keys (the root under one), and names gone/'s two keys for removal.
      # Every byte must be what want/ holds.
      - {task: pages, vars: {RUN: '{{.F}}/run-pages', STAGING: '{{.F}}/run-pages/staging', INDEX: '{{.CTAN_INDEX}}', PAGE_FOOT: '{{.CTAN_FOOT}}'}}
      - diff -r {{.F}}/run-pages/want/staging {{.F}}/run-pages/staging
      - diff -r {{.F}}/run-pages/want/slash {{.F}}/run-pages/slash
      - cmp {{.F}}/run-pages/want/index-make.txt {{.F}}/run-pages/index-make.txt && cmp {{.F}}/run-pages/want/index-gone.txt {{.F}}/run-pages/index-gone.txt
      # run-smoke: an hour whose only change is timestamp, whose one redrawn page is the root.
      # smoke reads timestamp back and sizes it against the listing, then the root page under
      # its INDEX key (a filesystem cannot hold the slashless key beside it). Over file:// the
      # canary and the Content-Encoding check say they skipped.
      - {task: smoke, vars: {RUN: '{{.F}}/run-smoke', STAGING: '{{.F}}/run-smoke/staging', URL: 'file://{{.F}}/run-smoke/staging'}}
      # A page index drew that is not in staging cannot pass.
      - '! task smoke-refuses 2>/dev/null'
      # run-label, made here because its names and bytes are the point: every rule label
      # keeps. A COMPRESSED ending wins over the rest of the name (a.diff.gz, c.tgz, l.Z); a
      # drawn type the bytes contradict gives way to them (d.txt with a NUL, f.pdf that is
      # gzip); a type nothing contradicts stands (g.sig, h.xpi, j.sty with a ^Z, sub/i.html);
      # a name with no type is typed from the bytes (README, empty k, m and n); an ending
      # Python reads as compressed and COMPRESSED lacks is never text (q.txt.br); and a
      # colon is no URL scheme (data:p.html). label-trees then moves all but timestamp out,
      # one tree per type, and back, and staging is byte for byte what it was.
      - |
        d={{.F}}/run-label/staging; mkdir -p $d/sub
        printf '\037\213\010' > $d/a.diff.gz; printf '\375\067\172\130\132\000' > $d/b.tar.xz
        printf '\037\213\010' > $d/c.tgz; printf 'plain words\n' > $d/README
        printf 'x\000y' > $d/d.txt; printf '%%PDF-1.4\n' > $d/e.pdf; printf '\037\213\010' > $d/f.pdf
        printf '\211\001\000' > $d/g.sig; printf 'PK\003\004' > $d/h.xpi; printf '<p></p>\n' > $d/sub/i.html
        printf 'x\032y\n' > $d/j.sty; : > $d/k; printf '\037\235' > $d/l.Z; printf 'x\000' > $d/m
        printf 'BZh9' > $d/n; printf '<p></p>\n' > "$d/data:p.html"; printf 'abc' > $d/q.txt.br
        printf '2026-10-08-05-02\n' > $d/timestamp
        cp -R $d {{.F}}/run-label/before
      - {task: label, vars: {RUN: '{{.F}}/run-label', DIR: '{{.F}}/run-label/staging'}}
      - |
        printf '%s\t%s\n' README text/plain a.diff.gz application/x-gzip b.tar.xz application/x-xz \
          c.tgz application/x-gzip d.txt application/octet-stream data:p.html text/html e.pdf application/pdf \
          f.pdf application/x-gzip g.sig application/pgp-signature h.xpi application/x-xpinstall \
          j.sty text/x-tex k text/plain l.Z application/x-compress m application/octet-stream \
          n application/x-bzip2 q.txt.br application/octet-stream sub/i.html text/html timestamp text/plain \
        | diff - {{.F}}/run-label/labels.txt
      - {task: label-trees, vars: {TO: up, RUN: '{{.F}}/run-label', STAGING: '{{.F}}/run-label/staging'}}
      - test "$(cd {{.F}}/run-label/staging && find . -type f)" = ./timestamp && test "$(ls {{.F}}/run-label/up/*.type | wc -l)" -eq 11
      - {task: label-trees, vars: {TO: staging, RUN: '{{.F}}/run-label', STAGING: '{{.F}}/run-label/staging'}}
      - diff -r {{.F}}/run-label/before {{.F}}/run-label/staging && test ! -e {{.F}}/run-label/up
      # relabel-plan over a state that holds a directory named like a tarball (gnu's librejs
      # has two) and one whose name carries glob characters: only files ending in a
      # COMPRESSED suffix are matches, .z is not .Z, and both directories' slashless page
      # keys are spared, the second as a glob that matches it alone.
      - |
        mkdir -p {{.F}}/run-relabel
        printf '%s\t1\t-\n' 'a b.diff.gz' 'lib/x.tar.gz/inner.xpi' 'p[1]*?.tar.gz/f' plain.txt u.Z v.z > {{.F}}/run-relabel/applied.txt
      - {task: relabel-plan, vars: {RUN: '{{.F}}/run-relabel'}}
      - printf '%s\t%s\n' 'a b.diff.gz' application/x-gzip u.Z application/x-compress | diff - {{.F}}/run-relabel/relabel.txt
      - printf '%s\n' lib/x.tar.gz 'p[[]1][*][?].tar.gz' | diff - {{.F}}/run-relabel/relabel-skip.txt
      # fresh over three clocks served off a filesystem: Unix time an hour old and CTAN's
      # dated form two hours old pass; Unix time two days old, Savannah's layout, fails.
      - |
        r={{.F}}/run-fresh; mkdir -p $r/srv; now=$(date -u +%s)
        echo $((now - 3600)) > $r/srv/new.txt
        printf '%s\nThu Oct  8 03:30:01 UTC 2026\n' $((now - 172800)) > $r/srv/old.txt
        printf '# This file is for administrative purposes only.\nirony.dante.de\n%s\n' "$(date -u -d @$((now - 7200)) +%Y-%m-%d-%H-%M)" > $r/srv/timestamp
        printf '%s\t1\t-\n' new.txt old.txt timestamp > $r/applied.txt
      - {task: fresh, vars: {RUN: '{{.F}}/run-fresh', URL: 'file://{{.F}}/run-fresh/srv', FRESH_KEY: new.txt}}
      - {task: fresh, vars: {RUN: '{{.F}}/run-fresh', URL: 'file://{{.F}}/run-fresh/srv', FRESH_KEY: timestamp}}
      - '! task fresh-refuses 2>/dev/null'
      - 'echo "offline: every check passed"'
  fresh-refuses:
    desc: fresh over offline's run-fresh with a clock two days old; offline expects it to fail
    cmds:
      - {task: fresh, vars: {RUN: '{{.RUN}}/fixtures/run-fresh', URL: 'file://{{.RUN}}/fixtures/run-fresh/srv', FRESH_KEY: old.txt}}
  due-refuses:
    desc: due-rule over offline's due fixture with RECONCILE R and RECONCILE_HOURS H; offline expects it to refuse
    cmds:
      - {task: due-rule, vars: {RUN: '{{.RUN}}/fixtures/due', RECONCILE: '{{.R | default "auto"}}', RECONCILE_HOURS: '{{.H | default 24}}'}}
  smoke-refuses:
    desc: smoke over run-smoke with the page index drew gone from staging, after offline copied the fixtures; offline expects it to fail
    vars:
      R: '{{.RUN}}/fixtures/run-smoke'
    cmds:
      - rm -f {{.R}}/staging/{{.INDEX}}
      - {task: smoke, vars: {RUN: '{{.R}}', STAGING: '{{.R}}/staging', URL: 'file://{{.R}}/staging'}}
  verify-refuses:
    desc: verify over a batch naming a container the tlpdb does not describe, after offline staged run-tl; offline expects it to fail
    vars:
      R: '{{.RUN}}/fixtures/run-tl'
    cmds:
      - {task: fetch, vars: {RUN: '{{.R}}', SOURCE: '{{.ROOT_DIR}}/fixtures/tree/', RSYNC: 'rsync --no-h', B: '{{.R}}/batch-bad.txt'}}
      - {task: verify, vars: {RUN: '{{.R}}', B: '{{.R}}/batch-bad.txt', TL: tl, TL_KEY: 3505F9E22FF030FE5D9C655A825C376AB4571163}}
