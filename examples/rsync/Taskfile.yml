# A Taskfile that includes the toolbox and the rsync engine, with the rsync image. In this
# repo, the includes are paths. A mirror includes these URLs:
#   - https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
#   - https://raw.githubusercontent.com/katoptra/lib/v2/engines/rsync.yml
#
# The pipeline is the pipeline of the engine. render.txt holds each command of the
# pipeline. render.txt is the check of the engine in this library.
# `task run -- task offline` does the verbs that use no bucket, on fixtures/.
version: '3'
vars:
  SOURCE: rsync://rsync.example.org/pub/
  BUCKET: example
  HOST: example.katoptra.org
  LIST_FLOOR: 1
  INDEX: '{{.HOST}}.directory.index.html'
  INDEX_FILES: index.html index.htm
  PAGE_FOOT: 'A mirror of rsync.example.org/pub/. <a href="https://example.org/issues">Report a problem</a>.'
  CANARY: pub/index.html
  FRESH_KEY: timestamp
includes:
  toolbox:
    taskfile: ../../toolbox.yml
    flatten: true
    vars:
      NAME: example-rsync
      DESC: the rsync toolbox and engine, exercised
      IMAGE: ghcr.io/katoptra/toolbox:rsync-dev
      LIB_DIR: ../..
      MENU: '"" "${c}engine -- offline, inside the image${r}" "  task run -- task offline  Every verb that needs no bucket, over fixtures/"'
  rsync:
    taskfile: ../../engines/rsync.yml
    flatten: true
tasks:
  tools:
    desc: Every tool the rsync image promises, by version
    cmds:
      - rsync --version | head -1
      - aws --version
      - gpgv --version | head -1
      - xz --version | head -1
      - shasum --version
  offline:
    desc: Every engine verb that needs no bucket, over fixtures/ copied under .run, inside the image
    vars:
      F: '{{.RUN}}/fixtures'
      # fixtures/tree is a signed subtree, tl/, with the shape of the TeX Live tree. Its
      # tlpdb identifies the containers of one package. A temporary key gives the
      # signature of its sha512. The public key of that key is in the keyring of the tree.
      # Upstream also keeps its keyring in its tree. FP is the value that a mirror pins as
      # TL_KEY.
      TREE: '{{.ROOT_DIR}}/fixtures/tree/'
      # A local tree. Here, the daemon-only flags of the engine are a usage error.
      LOCAL: rsync --no-h
      FP: 3505F9E22FF030FE5D9C655A825C376AB4571163
      # run-pages/want/ is the page set of ctan for that state. It is the same as the
      # pages that ctan.katoptra.org sends. It has the INDEX of ctan, and a last line with
      # a link to the directory on ctan.org.
      CTAN_INDEX: ctan.katoptra.org.directory.index.html
      CTAN_FOOT: '<a href="https://ctan.org/tex-archive/%s">This directory on ctan.org</a>. Sizes in bytes, times as CTAN lists them.'
    cmds:
      # list and normalise on a local tree: its two regular files, sorted with byte
      # collation, and no directory. upstream-dirs.txt gets its two directories, each with
      # a slash at the end, and not the root.
      - {task: list, vars: {SOURCE: '{{.ROOT_DIR}}/fixtures/run-root/staging/', RSYNC: 'rsync --no-h'}}
      - test "$(cut -f1 {{.RUN}}/upstream.txt | tr '\n' ' ')" = "a/b/f.txt timestamp "
      - test "$(tr '\n' ' ' < {{.RUN}}/upstream-dirs.txt)" = "a/ a/b/ "
      # The verbs write their files adjacent to the files that they read. Thus, they
      # operate on a copy.
      - rm -rf {{.F}} && cp -R {{.ROOT_DIR}}/fixtures {{.F}}
      # run-root: the hour in which one file at the bucket root changed. diff finds it.
      # merge records it in the state, from staging. split makes it the one batch, the
      # decision batch.
      - {task: diff, vars: {RUN: '{{.F}}/run-root'}}
      - test "$(cut -f1 {{.F}}/run-root/changed.txt)" = timestamp && test ! -s {{.F}}/run-root/deleted.txt
      - {task: merge, vars: {RUN: '{{.F}}/run-root', STAGING: '{{.F}}/run-root/staging', B: '{{.F}}/run-root/changed.txt'}}
      - cmp {{.F}}/run-root/applied.new {{.F}}/run-root/upstream.txt
      - {task: split, vars: {RUN: '{{.F}}/run-root', STAGING: '{{.F}}/staging'}}
      - test "$(ls {{.F}}/run-root/batch-*.txt | wc -l)" -eq 1 && cmp {{.F}}/run-root/batch-0001.txt {{.F}}/run-root/changed.txt
      # run-empty: the batch identifies a file that upstream removed before fetch. Thus,
      # staging did not get it. merge removes it, and the state does not identify a key
      # that the bucket does not have.
      - {task: diff, vars: {RUN: '{{.F}}/run-empty'}}
      - {task: merge, vars: {RUN: '{{.F}}/run-empty', STAGING: '{{.F}}/run-empty/staging', B: '{{.F}}/run-empty/changed.txt'}}
      - cmp {{.F}}/run-empty/applied.new {{.F}}/run-empty/applied.txt
      # run-resign: upstream wrote the sha512 and the signature of x.exe again, and it did
      # not change x.exe. Each night, the build of TeX Live does this to its prebuilt
      # installer. diff puts x.exe back into the delta. Thus, verify has the file that the
      # sha512 identifies. y.exe did not change, and it stays out of the delta.
      - {task: diff, vars: {RUN: '{{.F}}/run-resign', TL: tl}}
      - test "$(cut -f1 {{.F}}/run-resign/changed.txt | tr '\n' ' ')" = "tl/x.exe tl/x.exe.sha512 tl/x.exe.sha512.asc "
      # retry: retry accepts exit codes 23 and 24. After a transport exit code, retry
      # tries again five times. Each other exit code stops retry.
      - task retry CMD='exit 23' RETRY_BASE=0
      - task retry CMD='exit 24' RETRY_BASE=0
      - '! task retry CMD=''exit 5'' RETRY_BASE=0 2>/dev/null'
      - '! task retry CMD=''exit 3'' RETRY_BASE=0 2>/dev/null'
      # due-rule, for a run that starts at 1000000:
      #   - auto reconciles with no last reconcile, and at 23 h 50 min.
      #   - auto does not reconcile at less than 3 h, unless RECONCILE_HOURS is 2 or
      #     RECONCILE=true.
      #   - false does not reconcile.
      #   - A RECONCILE that is not one of the three values stops the run.
      #   - An hour count that is not an integer of 1 or more stops the run. The shell
      #     reads 08 as octal.
      - mkdir -p {{.F}}/due && echo 1000000 > {{.F}}/due/start.txt
      - {task: due-rule, vars: {RUN: '{{.F}}/due'}}
      - test -f {{.F}}/due/reconcile
      - {task: due-rule, vars: {RUN: '{{.F}}/due', RECONCILE: 'false'}}
      - test ! -f {{.F}}/due/reconcile
      - echo 914000 > {{.F}}/due/reconciled
      - {task: due-rule, vars: {RUN: '{{.F}}/due'}}
      - test -f {{.F}}/due/reconcile
      - echo 990000 > {{.F}}/due/reconciled
      - {task: due-rule, vars: {RUN: '{{.F}}/due'}}
      - test ! -f {{.F}}/due/reconcile
      - {task: due-rule, vars: {RUN: '{{.F}}/due', RECONCILE_HOURS: 2}}
      - test -f {{.F}}/due/reconcile
      - {task: due-rule, vars: {RUN: '{{.F}}/due', RECONCILE: 'true'}}
      - test -f {{.F}}/due/reconcile
      - task due-refuses R=yes 2>&1 | grep -q 'RECONCILE is true, false or auto'
      - task due-refuses H=abc 2>&1 | grep -q 'RECONCILE_HOURS is a whole number'
      - task due-refuses H=08 2>&1 | grep -q 'RECONCILE_HOURS is a whole number'
      # run-tl: the signed subtree.
      #   1. prepare downloads the control files from the tree. It examines the signed
      #      sha512 with the pinned key.
      #   2. fetch puts the batch in staging.
      #   3. verify examines the signed file in the batch. It examines each container with
      #      the tlpdb, with the two names of the container (three sums: the stable
      #      container, the revision-stamped container and the doc container). The batch
      #      holds the tlpdb. Thus, verify also examines the full decision batch.
      #
      # The batch is in the STAGING of the engine, because the calls to fetch and verify
      # give no STAGING. verify starts each command with `cd {{.STAGING}}`. Thus, a
      # STAGING call var can move the directory of verify.
      - {task: prepare, vars: {RUN: '{{.F}}/run-tl', SOURCE: '{{.TREE}}', RSYNC: '{{.LOCAL}}', TL: tl, TL_KEY: '{{.FP}}'}}
      - test -f {{.F}}/run-tl/tl/tlpkg/texlive.tlpdb
      - {task: fetch, vars: {RUN: '{{.F}}/run-tl', SOURCE: '{{.TREE}}', RSYNC: '{{.LOCAL}}', B: '{{.F}}/run-tl/batch-0001.txt'}}
      - {task: verify, vars: {RUN: '{{.F}}/run-tl', B: '{{.F}}/run-tl/batch-0001.txt', TL: tl, TL_KEY: '{{.FP}}'}}
      - test "$(wc -l < {{.F}}/run-tl/tl/sums.txt)" -eq 3 && test ! -s {{.F}}/run-tl/tl/missing.txt
      # verify rejects a container that the tlpdb does not identify, independently of its
      # bytes.
      - '! task verify-refuses 2>/dev/null'
      # run-pages: the new state has a file with & < > in its name, and a directory with a
      # space in its name. gone/ is not in the new state. pages makes the pages of the
      # root, a/, a/b/ and a/sp ace/, each with its two keys (the root with one). It also
      # gives the two keys of gone/ for removal. a/doc/ has index.htm and index.html. Thus,
      # its listing goes only to its key without the slash, and index-real.txt gives
      # index.html, the first name in INDEX_FILES, as the source of its page key. Each byte
      # must agree with want/. staging keeps the empty directory a/doc/, which git cannot
      # keep in want/. The upload sends no empty directory.
      #
      # upstream-dirs.txt also has e1/ and e1/e2/, two directories with no file. Each gets a
      # page, and the root page and the page of e1/ show them. indexed.txt has no stamp
      # (the format before PAGE_FORMAT 2). Thus, pages makes all the pages again, and it
      # still gives the two keys of gone/ for removal. indexed.new starts with the stamp.
      - {task: pages, vars: {RUN: '{{.F}}/run-pages', STAGING: '{{.F}}/run-pages/staging', INDEX: '{{.CTAN_INDEX}}', PAGE_FOOT: '{{.CTAN_FOOT}}', UPSTREAM: 'https://ctan.org/tex-archive/'}}
      - test "$(tr '\n' '|' < {{.F}}/run-pages/index-make.txt)" = "|a/|a/b/|a/doc/|a/sp ace/|e1/|e1/e2/|"
      - test -f "{{.F}}/run-pages/staging/e1/e2/{{.CTAN_INDEX}}" && grep -q 'href="e2/"' "{{.F}}/run-pages/staging/e1/{{.CTAN_INDEX}}"
      - head -1 {{.F}}/run-pages/indexed.new | grep -q '^#pages [0-9a-f]\{16\}$'
      - find {{.F}}/run-pages/staging -type d -empty -delete && diff -r {{.F}}/run-pages/want/staging {{.F}}/run-pages/staging
      - diff -r {{.F}}/run-pages/want/slash {{.F}}/run-pages/slash
      - cmp {{.F}}/run-pages/want/index-make.txt {{.F}}/run-pages/index-make.txt && cmp {{.F}}/run-pages/want/index-gone.txt {{.F}}/run-pages/index-gone.txt
      - cmp {{.F}}/run-pages/want/index-real.txt {{.F}}/run-pages/index-real.txt && cmp {{.F}}/run-pages/want/indexed.new {{.F}}/run-pages/indexed.new
      # smoke reads the page of the last line of index-make.txt, e1/e2/, which has no file.
      # The page must be in staging. fresh then reads timestamp, as in run-smoke, with its
      # size in upstream.txt.
      - >-
        r={{.F}}/run-pages; date -u +%s > $r/staging/timestamp &&
        printf 'timestamp\t%s\t-\n' "$(wc -c < $r/staging/timestamp | tr -d ' ')" > $r/upstream.txt
      - {task: smoke, vars: {RUN: '{{.F}}/run-pages', STAGING: '{{.F}}/run-pages/staging', URL: 'file://{{.F}}/run-pages/staging', INDEX: '{{.CTAN_INDEX}}'}}
      # run-pages-stamp: INDEXED is the indexed.new of run-pages. With the same vars, the
      # stamp agrees, and pages makes no page. With a different PAGE_FOOT, the stamp does
      # not agree, and pages makes the page of each directory again.
      - |
        r={{.F}}/run-pages-stamp; mkdir -p $r
        cp {{.F}}/run-pages/applied.txt {{.F}}/run-pages/upstream-dirs.txt $r/ && cp {{.F}}/run-pages/indexed.new $r/indexed.txt
      - {task: pages, vars: {RUN: '{{.F}}/run-pages-stamp', STAGING: '{{.F}}/run-pages-stamp/staging', INDEX: '{{.CTAN_INDEX}}', PAGE_FOOT: '{{.CTAN_FOOT}}', UPSTREAM: 'https://ctan.org/tex-archive/'}}
      - test ! -s {{.F}}/run-pages-stamp/index-make.txt
      - {task: pages, vars: {RUN: '{{.F}}/run-pages-stamp', STAGING: '{{.F}}/run-pages-stamp/staging', INDEX: '{{.CTAN_INDEX}}', PAGE_FOOT: x, UPSTREAM: 'https://ctan.org/tex-archive/'}}
      - cmp {{.F}}/run-pages-stamp/index-make.txt {{.F}}/run-pages-stamp/index-dirs.txt
      # CTYPE gives the full value of the header, with its charset.
      - "test \"$(printf 'HTTP/2 200\\r\\nContent-Type: text/plain; charset=utf-8\\r\\n' | {{.CTYPE}})\" = 'text/plain; charset=utf-8'"
      # run-smoke: an hour with one change only, timestamp, and one new page only, the
      # root. smoke reads timestamp again, and it compares its size with the listing. Then
      # it reads the root page at its INDEX key (a filesystem cannot hold the slashless
      # key adjacent to it). With file://, the canary and the Content-Encoding check show
      # that they did not operate.
      #
      # Last, fresh reads the clock in timestamp, the FRESH_KEY file. The first command
      # that follows writes the time of the check into it, in the 11 bytes that the
      # listing records.
      - date -u +%s > {{.F}}/run-smoke/staging/timestamp
      - {task: smoke, vars: {RUN: '{{.F}}/run-smoke', STAGING: '{{.F}}/run-smoke/staging', URL: 'file://{{.F}}/run-smoke/staging'}}
      # smoke rejects a page that index made and that is not in staging.
      - '! task smoke-refuses 2>/dev/null'
      # run-copy: the one new page is doc/, a directory with an index file. Its page key is
      # a copy of doc/index.html. smoke reads the two keys and compares their sizes and
      # types. smoke-refuses-copy makes the copy one byte longer.
      - |
        r={{.F}}/run-copy; mkdir -p $r/staging/doc; printf '<p>doc</p>\n' > $r/staging/doc/index.html
        cp $r/staging/doc/index.html "$r/staging/doc/{{.INDEX}}"; printf 'doc/\n' > $r/index-make.txt
        printf 'doc/index.html\tdoc/{{.INDEX}}\n' > $r/index-real.txt; : > $r/applied.txt
      - {task: smoke, vars: {RUN: '{{.F}}/run-copy', STAGING: '{{.F}}/run-copy/staging', URL: 'file://{{.F}}/run-copy/staging'}}
      - '! task smoke-refuses-copy 2>/dev/null'
      # run-copy-cli: index-copy gives each source key to the CLI with no change, because
      # the CLI encodes --copy-source. A key that is encoded first is encoded two times,
      # and the copy then reads a different key. A stub aws, first on PATH, records the arguments.
      - |
        r={{.F}}/run-copy-cli; mkdir -p $r/bin
        cat > $r/bin/aws <<'EOF'
        #!/bin/sh
        printf '%s\n' "$@" >> "$(dirname "$0")/../args"
        EOF
        chmod +x $r/bin/aws; printf 'a b/c+d/index.html\ta b/c+d/{{.INDEX}}\n' > $r/index-real.txt
      - PATH="{{.F}}/run-copy-cli/bin:$PATH" task copy-cli
      - >-
        printf '%s\n' s3api copy-object --bucket {{.BUCKET}} --copy-source '{{.BUCKET}}/a b/c+d/index.html'
        --key 'a b/c+d/{{.INDEX}}' --metadata-directive COPY | diff - {{.F}}/run-copy-cli/args
      # run-label: the command makes it here, because this test is about its names and its
      # bytes. It has a test case for each rule of label:
      #   - A COMPRESSED ending is more important than the remaining part of the name
      #     (a.diff.gz, c.tgz, l.Z).
      #   - When the bytes do not agree with a type that a browser shows, the type of the
      #     bytes is the label (d.txt with a NUL, f.pdf that is gzip).
      #   - When nothing shows that a type is incorrect, the type stays (g.sig, h.xpi,
      #     j.sty with a ^Z, sub/i.html).
      #   - A name with no type gets a type from its bytes (README, the empty k, m and n).
      #   - An ending that Python reads as compressed and that COMPRESSED does not have is
      #     not text (q.txt.br).
      #   - A colon is not a URL scheme (data:p.html).
      #   - A text type gets "; charset=utf-8" only when the full file is UTF-8: ASCII
      #     (README), non-ASCII UTF-8 (r.txt) and the empty k. Latin-1 (s.txt) and UTF-16
      #     (u.txt) get no charset.
      # label-trees then moves each file other than timestamp out, one tree for each type,
      # and then back. After that, staging has the same bytes that it had at the start.
      - |
        d={{.F}}/run-label/staging; mkdir -p $d/sub
        printf '\037\213\010' > $d/a.diff.gz; printf '\375\067\172\130\132\000' > $d/b.tar.xz
        printf '\037\213\010' > $d/c.tgz; printf 'plain words\n' > $d/README
        printf 'x\000y' > $d/d.txt; printf '%%PDF-1.4\n' > $d/e.pdf; printf '\037\213\010' > $d/f.pdf
        printf '\211\001\000' > $d/g.sig; printf 'PK\003\004' > $d/h.xpi; printf '<p></p>\n' > $d/sub/i.html
        printf 'x\032y\n' > $d/j.sty; : > $d/k; printf '\037\235' > $d/l.Z; printf 'x\000' > $d/m
        printf 'BZh9' > $d/n; printf '<p></p>\n' > "$d/data:p.html"; printf 'abc' > $d/q.txt.br
        printf 'caf\303\251\n' > $d/r.txt; printf 'caf\351\n' > $d/s.txt; printf '\377\376a\000' > $d/u.txt
        printf '2026-10-08-05-02\n' > $d/timestamp
        cp -R $d {{.F}}/run-label/before
      - {task: label, vars: {RUN: '{{.F}}/run-label', DIR: '{{.F}}/run-label/staging'}}
      - |
        u='; charset=utf-8'
        printf '%s\t%s\n' README "text/plain$u" a.diff.gz application/x-gzip b.tar.xz application/x-xz \
          c.tgz application/x-gzip d.txt application/octet-stream data:p.html "text/html$u" e.pdf application/pdf \
          f.pdf application/x-gzip g.sig application/pgp-signature h.xpi application/x-xpinstall \
          j.sty "text/x-tex$u" k "text/plain$u" l.Z application/x-compress m application/octet-stream \
          n application/x-bzip2 q.txt.br application/octet-stream r.txt "text/plain$u" s.txt text/plain \
          sub/i.html "text/html$u" timestamp "text/plain$u" u.txt text/plain \
        | diff - {{.F}}/run-label/labels.txt
      - {task: label-trees, vars: {TO: up, RUN: '{{.F}}/run-label', STAGING: '{{.F}}/run-label/staging'}}
      - test "$(cd {{.F}}/run-label/staging && find . -type f)" = ./timestamp && test "$(ls {{.F}}/run-label/up/*.type | wc -l)" -eq 12
      - {task: label-trees, vars: {TO: staging, RUN: '{{.F}}/run-label', STAGING: '{{.F}}/run-label/staging'}}
      - diff -r {{.F}}/run-label/before {{.F}}/run-label/staging && test ! -e {{.F}}/run-label/up
      # fresh on three clocks, from a filesystem:
      #   - fresh accepts a Unix time one hour before the check, and a date in the format
      #     of CTAN two hours before the check.
      #   - fresh rejects a Unix time two days before the check, in the format of
      #     Savannah.
      - |
        r={{.F}}/run-fresh; mkdir -p $r/srv; now=$(date -u +%s)
        echo $((now - 3600)) > $r/srv/new.txt
        printf '%s\nThu Oct  8 03:30:01 UTC 2026\n' $((now - 172800)) > $r/srv/old.txt
        printf '# This file is for administrative purposes only.\nirony.dante.de\n%s\n' "$(date -u -d @$((now - 7200)) +%Y-%m-%d-%H-%M)" > $r/srv/timestamp
        printf '%s\t1\t-\n' new.txt old.txt timestamp > $r/applied.txt
      - {task: fresh, vars: {RUN: '{{.F}}/run-fresh', URL: 'file://{{.F}}/run-fresh/srv', FRESH_KEY: new.txt}}
      - {task: fresh, vars: {RUN: '{{.F}}/run-fresh', URL: 'file://{{.F}}/run-fresh/srv', FRESH_KEY: timestamp}}
      - '! task fresh-refuses 2>/dev/null'
      - 'echo "offline: every check passed"'
  fresh-refuses:
    desc: fresh over offline's run-fresh with a clock two days old; offline expects it to fail
    cmds:
      - {task: fresh, vars: {RUN: '{{.RUN}}/fixtures/run-fresh', URL: 'file://{{.RUN}}/fixtures/run-fresh/srv', FRESH_KEY: old.txt}}
  due-refuses:
    desc: due-rule over offline's due fixture with RECONCILE R and RECONCILE_HOURS H; offline expects it to refuse
    cmds:
      - {task: due-rule, vars: {RUN: '{{.RUN}}/fixtures/due', RECONCILE: '{{.R | default "auto"}}', RECONCILE_HOURS: '{{.H | default 24}}'}}
  smoke-refuses:
    desc: smoke over run-smoke with the page index drew gone from staging, after offline copied the fixtures; offline expects it to fail
    vars:
      R: '{{.RUN}}/fixtures/run-smoke'
    cmds:
      - rm -f {{.R}}/staging/{{.INDEX}}
      - {task: smoke, vars: {RUN: '{{.R}}', STAGING: '{{.R}}/staging', URL: 'file://{{.R}}/staging'}}
  copy-cli:
    desc: index-copy over run-copy-cli, after offline made it; offline runs this task with a stub aws first on PATH
    cmds:
      - {task: index-copy, vars: {RUN: '{{.RUN}}/fixtures/run-copy-cli'}}
  smoke-refuses-copy:
    desc: smoke over run-copy with the page key one byte longer than its source, after offline made run-copy; offline expects it to fail
    vars:
      R: '{{.RUN}}/fixtures/run-copy'
    cmds:
      - echo >> "{{.R}}/staging/doc/{{.INDEX}}"
      - {task: smoke, vars: {RUN: '{{.R}}', STAGING: '{{.R}}/staging', URL: 'file://{{.R}}/staging'}}
  verify-refuses:
    desc: verify over a batch naming a container the tlpdb does not describe, after offline staged run-tl; offline expects it to fail
    vars:
      R: '{{.RUN}}/fixtures/run-tl'
    cmds:
      - {task: fetch, vars: {RUN: '{{.R}}', SOURCE: '{{.ROOT_DIR}}/fixtures/tree/', RSYNC: 'rsync --no-h', B: '{{.R}}/batch-bad.txt'}}
      - {task: verify, vars: {RUN: '{{.R}}', B: '{{.R}}/batch-bad.txt', TL: tl, TL_KEY: 3505F9E22FF030FE5D9C655A825C376AB4571163}}
