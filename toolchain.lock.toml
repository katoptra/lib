sha256 = "829baeff1c07e055cfa132031b1d9f2282ccdf5076258e482caf2fda70aea5d0"

[awscli]
# AWS publishes no checksum for the installer. It publishes only a detached PGP signature
# adjacent to each artifact. The fetch stage examines that signature with
# docker/aws-cli.pub, and the signature key must have this fingerprint. Thus, a replaced
# zip stops the build.
#
# Caution: Get a new docker/aws-cli.pub from the AWS CLI User Guide before 2027-07-01. If
# AWS uses a new key, also change this fingerprint. After 2027-07-01, the key is expired,
# and gpgv gives EXPKEYSIG for an expired key, not GOODSIG.
version = "2.36.24"
url = "https://awscli.amazonaws.com/awscli-exe-linux-{arch}-{version}.zip"
key_fingerprint = "FB5DB77FD5C118B80511ADA8A6310ACC4672475C"   # AWS CLI Team <aws-cli@amazon.com>
