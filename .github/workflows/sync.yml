# A reusable workflow: one mirror, one run. The caller is a short workflow_dispatch
# workflow that an external scheduler starts. The caller gives `vars` to this workflow,
# and this workflow gets the secrets of the caller.
#
# A run reads 1Password one time: one `op run` gets the values of op.env for the full
# pipeline, with the failure path. A mirror without an op.env uses the secrets of the
# caller. The sync step exports them into its environment, and they go into the container
# with the names that its PASS var lists.
name: sync
on:
  workflow_call:
    inputs:
      vars:
        description: 'KEY=value pairs for the pipeline inside the image, e.g. "RECONCILE=true MAX_BATCHES=8"'
        type: string
        default: ''
      timeout-minutes:
        description: Under the six-hour job limit; every batch checkpoints, so a cut-off costs one batch
        type: number
        default: 355
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false
permissions:
  contents: read
  actions: write   # chain: gh workflow run
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This repository at the commit to which the caller pinned this workflow. Thus, the
      # toolbox action and the lock that it reads are of the same release as the workflow:
      # one pin, not two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: katoptra/lib, ref: '${{ github.job_workflow_sha }}', path: .lib}
      - uses: ./.lib/.github/actions/toolbox
        with: {op: "${{ hashFiles('op.env') != '' }}"}   # a mirror without an op.env does not use op
      # This df is on the host, because the image and the batches use the same disk of the
      # runner.
      - run: df -h . && task image
      # The shell divides vars into words, and each word becomes a go-task variable. The
      # engine can put such a variable into a command. This step rejects each word that is
      # not KEY=value, with only safe characters in the key and the value. This step holds
      # no secrets. Thus, a rejected input does not go to the next step.
      - name: The vars input is KEY=value pairs and nothing else
        env:
          VARS: ${{ inputs.vars }}
        run: sh .lib/.github/validate-vars.sh "$VARS"
      - name: task sync
        id: sync
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ inputs.vars }}
        # Each inherited secret becomes an environment variable of this step, with its
        # name, in memory. There is no file and no command line, and GitHub shows *** in
        # the log for each value. With an op.env, the pipeline reads 1Password, and it
        # does not use these variables. VARS is data that the shell divides into words. It
        # is not an expression in the script.
        run: |
          eval "$(printf '%s' "$SECRETS" | jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"')"
          task sync -- $VARS
      # The failure path of the pipeline operates in its container. Thus, when the runner
      # stops a run, the pipeline does not report and does not send a ping. The runner
      # stops a run after the timeout, after a cancellation, or when the image pull does
      # not complete. This step is that path, from a location that is not in the
      # container. After a usual failure, the pipeline does the failure path, and this
      # step does not operate.
      - name: The run was cut off
        if: always() && steps.sync.outcome != 'success' && steps.sync.outcome != 'failure'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: task op -- task failed
      - name: Chain the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        # chain-file.sh gets the file name of the caller from GITHUB_WORKFLOW_REF. Each
        # mirror can use a different name.
        run: |
          if [ -f .run/chain ]; then
            gh workflow run "$(sh .lib/.github/chain-file.sh "$GITHUB_WORKFLOW_REF")" --ref "$GITHUB_REF_NAME"
            echo "chained: next run queued" >> "$GITHUB_STEP_SUMMARY"
          fi
