name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        variant: [rsync, proton]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolbox
      # Each guard's own cases prove what it refuses; the build proves what it accepts.
      - name: The security guards refuse what they should
        if: matrix.variant == 'rsync'
        run: |
          sh .github/validate-vars.sh --check
          sh docker/gpg-gate-check.sh
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Layers cached in Actions, one scope per variant; release reads the same scope, so a
      # tag rebuilds only what the merge changed.
      - name: Build the image the example names
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.variant }}.Dockerfile
          load: true
          tags: ghcr.io/katoptra/toolbox:${{ matrix.variant }}-dev
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
      - name: The example's tools resolve inside the image
        working-directory: examples/${{ matrix.variant }}
        run: task run -- task tools
      - name: The example's render matches its render.txt
        working-directory: examples/${{ matrix.variant }}
        run: task check
      - name: The engine's verbs that need no bucket, over the fixtures
        working-directory: examples/${{ matrix.variant }}
        run: task run -- task offline
