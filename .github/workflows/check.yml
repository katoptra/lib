# A reusable workflow: it renders the pipeline of the mirror in its image, and it compares
# the render with render.txt. With offline: true, the job then starts the offline verb of
# the mirror in the image.
name: check
on:
  workflow_call:
    inputs:
      offline:
        description: The job runs task offline in the image after task check
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This repository at the commit to which the caller pinned this workflow. Thus, the
      # toolbox action and the lock that it reads are of the same release as the workflow:
      # one pin, not two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: katoptra/lib, ref: '${{ github.job_workflow_sha }}', path: .lib}
      - uses: ./.lib/.github/actions/toolbox
        with: {op: 'false'}   # a dry run uses no secrets
      - run: task check
      - if: inputs.offline
        run: task run -- task offline
